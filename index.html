    const { useState, useEffect } = React;

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Empanada de Carne', price: 5000, category: 'Comida', image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },

      { id: 'p3', name: 'Sándwich de Jamón y Queso', price: 8000, category: 'Comida', image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=300&q=80' },
      { id: 'p4', name: 'Gaseosa 500ml', price: 6000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80' },
      { id: 'p5', name: 'Jugo Natural', price: 5000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80' },
      { id: 'p6', name: 'Agua Mineral 500ml', price: 3000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p7', name: 'Alfajor', price: 4000, category: 'Postre', image: 'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p8', name: 'Brownie', price: 5000, category: 'Postre', image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80' }
    ];

    function renderBarChartBase64(title, labels, values, barColor = '#2563EB') {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#E5E7EB';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      ctx.fillStyle = '#1E3A8A';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(title, 24, 34);

      if (labels.length === 0) return canvas.toDataURL('image/png');

      const padLeft = 80;
      const padRight = 30;
      const padTop = 60;
      const padBottom = 65;
      const chartW = canvas.width - padLeft - padRight;
      const chartH = canvas.height - padTop - padBottom;
      const maxVal = Math.max(...values, 1);

      ctx.strokeStyle = '#F3F4F6';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#6B7280';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'right';

      for (let i = 0; i <= 4; i++) {
        const y = padTop + chartH - (chartH * i) / 4;
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(padLeft + chartW, y);
        ctx.stroke();
        const valLabel = Math.round((maxVal * i) / 4).toLocaleString();
        ctx.fillText('₲' + valLabel, padLeft - 8, y + 4);
      }

      const step = chartW / labels.length;
      const barW = Math.min(48, step * 0.6);

      labels.forEach((label, idx) => {
        const val = values[idx];
        const barH = (val / maxVal) * chartH;
        const x = padLeft + idx * step + (step - barW) / 2;
        const y = padTop + chartH - barH;

        ctx.fillStyle = barColor;
        ctx.fillRect(x, y, barW, barH);

        ctx.fillStyle = '#111827';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('₲' + val.toLocaleString(), x + barW / 2, y - 6);

        ctx.fillStyle = '#374151';
        ctx.font = '11px sans-serif';
        const shortLabel = label.length > 14 ? label.slice(0, 13) + '…' : label;
        ctx.fillText(shortLabel, x + barW / 2, padTop + chartH + 20);
      });

      return canvas.toDataURL('image/png');
    }

    function App() {
      // Sesión de espacio compartido (Colegio + PIN)
      const [session, setSession] = useState(() => {
        const saved = localStorage.getItem('cantinapp_cloud_session');
        return saved ? JSON.parse(saved) : null;
      });
      const [loginSchool, setLoginSchool] = useState('');
      const [loginPin, setLoginPin] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      const [syncError, setSyncError] = useState('');

      const [cart, setCart] = useState([]);
      const [activeRegister, setActiveRegister] = useState(() => {
        return localStorage.getItem('app_register') || 'Caja 1';
      });

      const [activeTab, setActiveTab] = useState('menu');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [searchQuery, setSearchQuery] = useState('');
      const [deliverySearch, setDeliverySearch] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      
      const [closingDate, setClosingDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [closingRegister, setClosingRegister] = useState('Todas');
      const [closingViewMode, setClosingViewMode] = useState('daily');
      const [isExporting, setIsExporting] = useState(false);

      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ name: '', price: '', category: 'Comida', image: '' });

      useEffect(() => {
        localStorage.setItem('app_register', activeRegister);
      }, [activeRegister]);

      // Conectar listeners en tiempo real de Firebase al iniciar sesión
      useEffect(() => {
        if (!session) return;

        setIsSyncing(true);
        setSyncError('');
        const spaceRef = db.collection('espacios').doc(session.spaceId);

        // 1. Escuchar catálogo de productos en tiempo real
        const unsubProducts = spaceRef.collection('productos').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty) {
              // Cargar catálogo inicial si el espacio es nuevo
              const localProds = JSON.parse(localStorage.getItem('app_products') || 'null') || INITIAL_PRODUCTS;
              const batch = db.batch();
              localProds.forEach(p => {
                batch.set(spaceRef.collection('productos').doc(p.id), p);
              });
              await batch.commit();
            } else {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setProducts(list);
            }
            setIsSyncing(false);
          },
          (err) => {
            console.error('Error sincronizando productos:', err);
            setSyncError('Sin conexión o permisos pendientes en Firebase.');
            setIsSyncing(false);
          }
        );

        // 2. Escuchar pedidos/ventas en tiempo real
        const unsubOrders = spaceRef.collection('pedidos')
          .orderBy('createdAt', 'desc')
          .onSnapshot(
            (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setOrders(list);
            },
            (err) => {
              console.error('Error sincronizando pedidos:', err);
            }
          );

        return () => {
          unsubProducts();
          unsubOrders();
        };
      }, [session]);

      useEffect(() => {
        if (activeOrder) {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
              text: activeOrder.id,
              width: 160,
              height: 160,
            });
          }
        }
      }, [activeOrder]);

      // Iniciar o crear espacio compartido por Colegio + PIN
      const handleJoinSpace = async (e) => {
        e.preventDefault();
        const cleanSchool = loginSchool.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const cleanPin = loginPin.trim();

        if (!cleanSchool || cleanPin.length < 4) {
          setLoginError('Ingresa un código de colegio y un PIN de al menos 4 dígitos.');
          return;
        }

        setIsLoggingIn(true);
        setLoginError('');

        try {
          const spaceRef = db.collection('espacios').doc(cleanSchool);
          const docSnap = await spaceRef.get();

          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.pin !== cleanPin) {
              setLoginError('PIN incorrecto para este colegio.');
              setIsLoggingIn(false);
              return;
            }
          } else {
            // Crear nuevo espacio para el colegio con su PIN
            await spaceRef.set({
              schoolName: loginSchool.trim(),
              pin: cleanPin,
              createdAt: Date.now()
            });
          }

          const newSession = { spaceId: cleanSchool, schoolName: loginSchool.trim() };
          localStorage.setItem('cantinapp_cloud_session', JSON.stringify(newSession));
          setSession(newSession);
        } catch (err) {
          console.error(err);
          setLoginError('Error de conexión con Firebase. Revisa tu internet o las reglas de Firestore.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (confirm('¿Deseas salir de este colegio para ingresar a otro?')) {
          localStorage.removeItem('cantinapp_cloud_session');
          setSession(null);
          setProducts([]);
          setOrders([]);
        }
      };

      // Subir ventas locales antiguas si existían antes de Firebase
      const handleMigrateLocalOrders = async () => {
        const localOrders = JSON.parse(localStorage.getItem('app_orders') || '[]');
        if (localOrders.length === 0) {
          alert('No hay ventas locales antiguas pendientes de subir.');
          return;
        }
        if (!confirm(`Se encontraron ${localOrders.length} ventas guardadas en este teléfono. ¿Deseas subirlas a la nube ahora?`)) return;

        try {
          const spaceRef = db.collection('espacios').doc(session.spaceId);
          const batch = db.batch();
          localOrders.forEach((o, idx) => {
            batch.set(spaceRef.collection('pedidos').doc(o.id), {
              ...o,
              createdAt: o.createdAt || (Date.now() - idx * 1000)
            });
          });
          await batch.commit();
          localStorage.removeItem('app_orders');
          alert('¡Ventas subidas y sincronizadas correctamente!');
        } catch (err) {
          alert('Error al subir ventas: ' + err.message);
        }
      };

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Guardar pedido directamente en Firebase Firestore
      const handleCheckout = async () => {
        if (cart.length === 0) return;
        const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
        const newOrder = {
          id: orderId,
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: Date.now(),
          items: cart,
          total: cartTotal,
          paymentMethod,
          register: activeRegister,
          status: 'Pendiente'
        };

        // Mostrar voucher de inmediato y guardar en Firestore
        setActiveOrder(newOrder);
        setCart([]);

        try {
          await db.collection('espacios').doc(session.spaceId)
            .collection('pedidos').doc(orderId).set(newOrder);
        } catch (err) {
          console.error('Error guardando pedido:', err);
          alert('El pedido se guardó localmente y se sincronizará al recuperar señal.');
        }
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!productForm.name || !productForm.price) return;

        const spaceRef = db.collection('espacios').doc(session.spaceId);
        const prodId = editingProduct ? editingProduct.id : 'p_' + Date.now();
        const prodData = {
          id: prodId,
          name: productForm.name,
          price: Number(productForm.price),
          category: productForm.category,
          image: productForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'
        };

        setEditingProduct(null);
        setProductForm({ name: '', price: '', category: 'Comida', image: '' });

        try {
          await spaceRef.collection('productos').doc(prodId).set(prodData);
        } catch (err) {
          alert('Error al guardar producto en la nube: ' + err.message);
        }
      };

      const startEditProduct = (prod) => {
        setEditingProduct(prod);
        setProductForm({ name: prod.name, price: prod.price, category: prod.category, image: prod.image });
      };

      const deleteProduct = async (id) => {
        if (confirm('¿Deseas eliminar este producto del menú en todos los dispositivos?')) {
          try {
            await db.collection('espacios').doc(session.spaceId)
              .collection('productos').doc(id).delete();
          } catch (err) {
            alert('Error al eliminar producto: ' + err.message);
          }
        }
      };

      const updateOrderStatus = async (orderId, newStatus) => {
        try {
          await db.collection('espacios').doc(session.spaceId)
            .collection('pedidos').doc(orderId).update({ status: newStatus });
        } catch (err) {
          alert('Error al actualizar estado: ' + err.message);
        }
      };

      const handleStartNewJornada = () => {
        if (confirm('¿Deseas iniciar una nueva jornada? Esto mantendrá todo el historial guardado por fechas y dejará el mostrador listo para nuevos pedidos.')) {
          setCart([]);
          setClosingDate(new Date().toISOString().split('T')[0]);
          alert('¡Nueva jornada iniciada correctamente!');
        }
      };

      const exportToExcel = async () => {
        if (orders.length === 0) {
          alert('No hay ventas registradas para exportar.');
          return;
        }

        setIsExporting(true);
        try {
          const workbook = new ExcelJS.Workbook();
          workbook.creator = 'CantinApp';
          workbook.created = new Date();

          const thinBorder = {
            top: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            left: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            right: { style: 'thin', color: { argb: 'FFD1D5DB' } }
          };

          const sheetDetail = workbook.addWorksheet('Ventas Detalladas', {
            views: [{ state: 'frozen', ySplit: 3 }]
          });

          sheetDetail.mergeCells('A1:H1');
          const titleCell = sheetDetail.getCell('A1');
          titleCell.value = `REPORTE DE VENTAS - ${session.schoolName.toUpperCase()}`;
          titleCell.font = { size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
          titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
          titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
          sheetDetail.getRow(1).height = 30;

          sheetDetail.columns = [
            { key: 'id', width: 14 },
            { key: 'date', width: 14 },
            { key: 'timestamp', width: 12 },
            { key: 'register', width: 12 },
            { key: 'paymentMethod', width: 16 },
            { key: 'status', width: 14 },
            { key: 'items', width: 42 },
            { key: 'total', width: 18 }
          ];

          const headerRow = sheetDetail.getRow(3);
          headerRow.values = ['ID Orden', 'Fecha', 'Hora', 'Caja', 'Medio de Pago', 'Estado', 'Detalle de Productos', 'Total (₲)'];
          headerRow.height = 24;
          headerRow.eachCell((cell) => {
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
            cell.border = thinBorder;
          });

          orders.forEach((o, index) => {
            const rowNum = index + 4;
            const row = sheetDetail.getRow(rowNum);
            const itemsStr = o.items.map(i => `${i.qty}x ${i.name}`).join(', ');
            row.values = [o.id, o.date, o.timestamp, o.register, o.paymentMethod, o.status, itemsStr, o.total];
            row.height = 22;

            const isEven = index % 2 === 1;
            const bgColor = o.status === 'Cancelado' ? 'FFFEE2E2' : (isEven ? 'FFEFF6FF' : 'FFFFFFFF');

            row.eachCell((cell, colNumber) => {
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              cell.border = thinBorder;
              cell.alignment = { vertical: 'middle', horizontal: colNumber === 7 ? 'left' : (colNumber === 8 ? 'right' : 'center') };
              if (colNumber === 8) {
                cell.numFmt = '"₲ "#,##0';
                cell.font = { bold: true, color: { argb: o.status === 'Cancelado' ? 'FF991B1B' : 'FF111827' } };
              }
            });
          });

          const lastDataRow = orders.length + 3;
          const totalRowNum = lastDataRow + 1;
          const totalRow = sheetDetail.getRow(totalRowNum);
          totalRow.height = 26;
          sheetDetail.mergeCells(`A${totalRowNum}:G${totalRowNum}`);
          totalRow.getCell(1).value = 'TOTAL GENERAL ACUMULADO';
          totalRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
          totalRow.getCell(8).value = { formula: `SUM(H4:H${lastDataRow})` };
          totalRow.getCell(8).numFmt = '"₲ "#,##0';
          totalRow.getCell(8).alignment = { horizontal: 'right', vertical: 'middle' };

          for (let c = 1; c <= 8; c++) {
            const cell = totalRow.getCell(c);
            cell.font = { bold: true, size: 11, color: { argb: 'FF1E3A8A' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDBEAFE' } };
            cell.border = {
              top: { style: 'medium', color: { argb: 'FF2563EB' } },
              bottom: { style: 'double', color: { argb: 'FF2563EB' } },
              left: thinBorder.left,
              right: thinBorder.right
            };
          }

          const sheetSummary = workbook.addWorksheet('Resumen y Gráficos');
          sheetSummary.columns = [
            { width: 28 },
            { width: 16 },
            { width: 20 },
            { width: 4 },
            { width: 24 },
            { width: 20 }
          ];

          sheetSummary.mergeCells('A1:F1');
          const sumTitle = sheetSummary.getCell('A1');
          sumTitle.value = 'RESUMEN EJECUTIVO Y GRÁFICOS COMPARATIVOS';
          sumTitle.font = { size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
          sumTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
          sumTitle.alignment = { horizontal: 'center', vertical: 'middle' };
          sheetSummary.getRow(1).height = 30;

          const validOrders = orders.filter(o => o.status !== 'Cancelado');

          sheetSummary.getCell('A3').value = '1. COMPARATIVO POR FECHA';
          sheetSummary.getCell('A3').font = { bold: true, size: 11, color: { argb: 'FF1E3A8A' } };

          const dateHeader = sheetSummary.getRow(4);
          dateHeader.getCell(1).value = 'Fecha';
          dateHeader.getCell(2).value = 'Pedidos';
          dateHeader.getCell(3).value = 'Recaudado (₲)';
          [1, 2, 3].forEach(c => {
            const cell = dateHeader.getCell(c);
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;
          });

          const byDate = {};
          validOrders.forEach(o => {
            if (!byDate[o.date]) byDate[o.date] = { count: 0, total: 0 };
            byDate[o.date].count += 1;
            byDate[o.date].total += o.total;
          });
          const sortedDates = Object.keys(byDate).sort();

          sortedDates.forEach((d, i) => {
            const r = sheetSummary.getRow(5 + i);
            r.getCell(1).value = d;
            r.getCell(2).value = byDate[d].count;
            r.getCell(3).value = byDate[d].total;
            r.getCell(3).numFmt = '"₲ "#,##0';
            [1, 2, 3].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFEFF6FF' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 3 ? 'right' : 'center' };
            });

          sheetSummary.getCell('E3').value = '2. MEDIOS DE PAGO';
          sheetSummary.getCell('E3').font = { bold: true, size: 11, color: { argb: 'FF065F46' } };

          const payHeader = sheetSummary.getRow(4);
          payHeader.getCell(5).value = 'Medio de Pago';
          payHeader.getCell(6).value = 'Total (₲)';
          [5, 6].forEach(c => {
            const cell = payHeader.getCell(c);
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF059669' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;
          });

          const byPay = {};
          validOrders.forEach(o => {
            byPay[o.paymentMethod] = (byPay[o.paymentMethod] || 0) + o.total;
          });
          const payKeys = Object.keys(byPay);

          payKeys.forEach((m, i) => {
            const r = sheetSummary.getRow(5 + i);
            r.getCell(5).value = m;
            r.getCell(6).value = byPay[m];
            r.getCell(6).numFmt = '"₲ "#,##0';
            [5, 6].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFECFDF5' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 6 ? 'right' : 'center' };
            });
          });

          const prodStartRow = Math.max(sortedDates.length, payKeys.length) + 7;
          sheetSummary.getCell(`A${prodStartRow}`).value = '3. RANKING DE PRODUCTOS MÁS VENDIDOS';
          sheetSummary.getCell(`A${prodStartRow}`).font = { bold: true, size: 11, color: { argb: 'FF92400E' } };

          const prodHeader = sheetSummary.getRow(prodStartRow + 1);
          prodHeader.getCell(1).value = 'Producto';
          prodHeader.getCell(2).value = 'Unidades';
          prodHeader.getCell(3).value = 'Total Generado (₲)';

            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD97706' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;

          const byProd = {};
          validOrders.forEach(o => {

              byProd[it.name].qty += it.qty;
              byProd[it.name].total += it.qty * it.price;
            });

          sortedProds.forEach(([name, data], i) => {
            const r = sheetSummary.getRow(prodStartRow + 2 + i);
            r.getCell(1).value = name;
            r.getCell(2).value = data.qty;
            r.getCell(3).value = data.total;
            r.getCell(3).numFmt = '"₲ "#,##0';
            [1, 2, 3].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFFFFBEB' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 1 ? 'left' : (c === 3 ? 'right' : 'center') };
            });
          });

          const chartStartRow = prodStartRow + sortedProds.length + 3;

          if (sortedDates.length > 0) {
            const dateChartBase64 = renderBarChartBase64(
              'Evolución de Ventas por Fecha (₲)',
              sortedDates.slice(-8),
              sortedDates.slice(-8).map(d => byDate[d].total),
              '#2563EB'
            );
            const dateImgId = workbook.addImage({ base64: dateChartBase64, extension: 'png' });
            sheetSummary.addImage(dateImgId, {
              tl: { col: 0, row: chartStartRow },
              ext: { width: 520, height: 290 }
            });
          }

          if (sortedProds.length > 0) {

          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error('Error al generar Excel:', err);
          alert('Hubo un problema al generar el archivo Excel.');

                              </div>
                              <div className="bg-gray-50 p-2 rounded text-center">
                                <span className="text-gray-500 block">Tarjeta</span>
                                <span className="font-bold">₲ {(salesByPayment['Tarjeta'] || 0).toLocaleString()}</span>
                              </div>
                            </div>

                            <h3 className="font-bold text-xs text-gray-700 mb-2">Productos Vendidos:</h3>
                            <div className="border rounded-lg overflow-hidden text-xs">
                              <table className="w-full text-left border-collapse">
                                <thead className="bg-gray-100 text-gray-600 border-b">
                                  <tr>
                                    <th className="p-2">Prod.</th>
                                    <th className="p-2 text-center">Cant.</th>
                                    <th className="p-2 text-right">Subtotal</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y">
                                  {Object.keys(productSalesMap).length === 0 ? (
                                    <tr><td colSpan="3" className="p-3 text-center text-gray-400">Sin ventas registradas</td></tr>
                                  ) : (
                                    Object.entries(productSalesMap).map(([name, data]) => (
                                      <tr key={name}>
                                        <td className="p-2 font-medium">{name}</td>
                                        <td className="p-2 text-center">{data.qty}</td>
                                        <td className="p-2 text-right font-semibold">₲ {data.subtotal.toLocaleString()}</td>
                                      </tr>
                                    ))
                                  )}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>

                        <div className="flex gap-2">
                          <button 
                            onClick={() => window.print()}
                            className="flex-1 bg-gray-800 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-gray-900 transition"
                          >
                            🖨️ Imprimir Reporte
                          </button>
                          <button 
                            onClick={exportToExcel}
                            disabled={isExporting}
                            className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-emerald-700 transition disabled:opacity-50"
                          >
                            {isExporting ? 'Generando...' : '📊 Exportar Excel (.xlsx)'}
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div className="bg-white border rounded-xl p-4 shadow-sm mb-4">
                          <div className="flex justify-between items-center mb-3 border-b pb-2">
                            <h2 className="font-bold text-base text-gray-800">📈 Comparativo por Fechas</h2>
                            <button 
                              onClick={exportToExcel}
                              disabled={isExporting}
                              className="bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg hover:bg-emerald-700 transition"
                            >
                              📊 Excel con Gráficos
                            </button>
                          </div>

                          <div className="border rounded-lg overflow-hidden text-xs">
                            <table className="w-full text-left border-collapse">
                              <thead className="bg-gray-100 text-gray-600 border-b">
                                <tr>
                                  <th className="p-2">Fecha</th>
                                  <th className="p-2 text-center">Ped.</th>
                                  <th className="p-2 text-right">Total</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y">
                                {historyList.length === 0 ? (
                                  <tr><td colSpan="3" className="p-3 text-center text-gray-400">No hay historial registrado</td></tr>
                                ) : (
                                  historyList.map(h => (
                                    <tr key={h.date} className="hover:bg-gray-50">
                                      <td className="p-2 font-medium">{h.date}</td>
                                      <td className="p-2 text-center">{h.ordersCount}</td>
                                      <td className="p-2 text-right font-bold text-blue-600">₲ {h.total.toLocaleString()}</td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* PESTAÑA GESTIÓN DE PRODUCTOS */}
                {activeTab === 'products' && (
                  <div>
                    <form onSubmit={handleSaveProduct} className="bg-white border rounded-xl p-3 shadow-sm mb-4 text-xs space-y-2">
                      <h3 className="font-bold text-sm text-gray-800 mb-1">{editingProduct ? 'Editar Producto' : 'Agregar Nuevo Producto'}</h3>
                      <div>
                        <label className="text-gray-600 block">Nombre del Producto:</label>
                        <input 
                          type="text" 
                          required
                          value={productForm.name}
                          onChange={(e) => setProductForm({ ...productForm, name: e.target.value })}
                          className="w-full border rounded p-1.5 mt-0.5"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-gray-600 block">Precio (₲):</label>
                          <input 
                            type="number" 
                            required
                            value={productForm.price}
                            onChange={(e) => setProductForm({ ...productForm, price: e.target.value })}
                            className="w-full border rounded p-1.5 mt-0.5"
                          />
                        </div>
                        <div>
                          <label className="text-gray-600 block">Categoría:</label>
                          <select 
                            value={productForm.category}
                            onChange={(e) => setProductForm({ ...productForm, category: e.target.value })}
                            className="w-full border rounded p-1.5 mt-0.5"
                          >
                            <option value="Comida">Comida</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Postre">Postre</option>
                            <option value="Otros">Otros</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="text-gray-600 block">URL de Imagen (Opcional):</label>
                        <input 
                          type="url" 
                          value={productForm.image}
                          onChange={(e) => setProductForm({ ...productForm, image: e.target.value })}
                          className="w-full border rounded p-1.5 mt-0.5"
                          placeholder="https://..."
                        />
                      </div>
                      <div className="flex gap-2 pt-1">
                        <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-1.5 rounded">
                          {editingProduct ? 'Guardar Cambios' : 'Crear Producto'}
                        </button>
                        {editingProduct && (
                          <button 
                            type="button" 
                            onClick={() => { setEditingProduct(null); setProductForm({ name: '', price: '', category: 'Comida', image: '' }); }}
                            className="bg-gray-200 text-gray-700 font-medium px-3 rounded"
                          >
                            Cancelar
                          </button>
                        )}
                      </div>
                    </form>

                    <h3 className="font-bold text-xs text-gray-700 mb-2">Catálogo Compartido en Vivo:</h3>
                    <div className="space-y-2">
                      {products.map(p => (
                        <div key={p.id} className="bg-white border rounded-lg p-2 flex items-center justify-between text-xs">
                          <div className="flex items-center gap-2">
                            <img src={p.image} alt={p.name} className="w-10 h-10 rounded object-cover" />
                            <div>
                              <div className="font-bold text-gray-800">{p.name}</div>
                              <div className="text-gray-500">₲ {p.price.toLocaleString()} • {p.category}</div>
                            </div>
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => startEditProduct(p)} className="bg-blue-100 text-blue-700 px-2 py-1 rounded font-semibold">Editar</button>
                            <button onClick={() => deleteProduct(p.id)} className="bg-red-100 text-red-700 px-2 py-1 rounded font-semibold">Eliminar</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* MODAL VOUCHER Y QR */}
          {activeOrder && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-center shadow-xl">
                <div className="text-green-500 font-bold text-sm mb-1">¡Pedido Registrado y Enviado!</div>
                <h2 className="text-xl font-bold text-gray-800">{activeOrder.id}</h2>
                <p className="text-xs text-gray-500 mb-4">{activeOrder.register} • {activeOrder.paymentMethod}</p>

                <div className="flex justify-center mb-4 bg-gray-50 p-3 rounded-xl">
                  <div id="qrcode"></div>
                </div>

                <div className="text-left bg-gray-50 p-3 rounded-xl text-xs space-y-1 mb-4">
                  <div className="font-bold text-gray-700 mb-1 border-b pb-1">Resumen del consumo:</div>
                  {activeOrder.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between">
                      <span>{it.qty}x {it.name}</span>
                      <span className="font-semibold">₲ {(it.price * it.qty).toLocaleString()}</span>
                    </div>
                  ))}
                  <div className="flex justify-between font-bold pt-1 border-t text-blue-600 text-sm">
                    <span>Total Pagado:</span>
                    <span>₲ {activeOrder.total.toLocaleString()}</span>
                  </div>
                </div>

                <button 
                  onClick={() => setActiveOrder(null)}
                  className="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-sm"
                >
                  Cerrar Voucher
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
