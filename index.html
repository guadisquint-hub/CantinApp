<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CantinApp - Por Grados y Cursos</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./favicon.ico">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- React y React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBe1LV62CNToESYwudcQkrvMWVlMNa4R84",
      authDomain: "cantinapp-958f3.firebaseapp.com",
      projectId: "cantinapp-958f3",
      storageBucket: "cantinapp-958f3.firebasestorage.app",
      messagingSenderId: "303292686085",
      appId: "1:303292686085:web:d8ce0ed8d1c7c933cbe16c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      console.log('Persistencia Firestore:', err.code);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then((reg) => {
            reg.update();
            setInterval(() => reg.update(), 5 * 60 * 1000);
          })
          .catch((err) => console.log('Error PWA:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Empanada de Carne', price: 5000, category: 'Comida', stock: 30, image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },
      { id: 'p2', name: 'Empanada de Queso', price: 4500, category: 'Comida', stock: 30, image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },
      { id: 'p3', name: 'Sándwich de Jamón y Queso', price: 8000, category: 'Comida', stock: 20, image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=300&q=80' },
      { id: 'p4', name: 'Gaseosa 500ml', price: 6000, category: 'Bebida', stock: 40, image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80' },
      { id: 'p5', name: 'Jugo Natural', price: 5000, category: 'Bebida', stock: 25, image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80' },
      { id: 'p6', name: 'Agua Mineral 500ml', price: 3000, category: 'Bebida', stock: 40, image: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p7', name: 'Alfajor', price: 4000, category: 'Postre', stock: 35, image: 'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p8', name: 'Brownie', price: 5000, category: 'Postre', stock: 20, image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80' }
    ];

    function App() {
      const [session, setSession] = useState(() => {
        const saved = localStorage.getItem('cantinapp_grade_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [accessMode, setAccessMode] = useState('caja');
      const [schoolInput, setSchoolInput] = useState('');
      const [gradeInput, setGradeInput] = useState('');
      const [inputPin, setInputPin] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      const [syncError, setSyncError] = useState('');

      const [cart, setCart] = useState([]);
      const [activeRegister, setActiveRegister] = useState(() => localStorage.getItem('app_register') || 'Caja 1');

      const [activeTab, setActiveTab] = useState('menu');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [searchQuery, setSearchQuery] = useState('');
      const [deliverySearch, setDeliverySearch] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      const [cashReceived, setCashReceived] = useState('');

      const [closingDate, setClosingDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [closingRegister, setClosingRegister] = useState('Todas');
      const [isExporting, setIsExporting] = useState(false);

      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ name: '', price: '', category: 'Comida', stock: '', image: '' });
      const [stockModalProd, setStockModalProd] = useState(null);
      const [stockToAdd, setStockToAdd] = useState('');

      const [deductModalProd, setDeductModalProd] = useState(null);
      const [stockToDeduct, setStockToDeduct] = useState('');

      const isProfessor = session?.role === 'profesor';
      const isStaff = session?.role === 'profesor' || session?.role === 'caja';

      useEffect(() => {
        localStorage.setItem('app_register', activeRegister);
      }, [activeRegister]);

      useEffect(() => {
        if (!session) return;

        setIsSyncing(true);
        setSyncError('');
        const gradeDocId = `${session.schoolId}__${session.gradeId}`;
        const gradeRef = db.collection('grados_cantina').doc(gradeDocId);

        const unsubProducts = gradeRef.collection('productos').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty && session.role !== 'viewer') {
              const batch = db.batch();
              INITIAL_PRODUCTS.forEach(p => {
                batch.set(gradeRef.collection('productos').doc(p.id), {
                  ...p,
                  stock: typeof p.stock === 'number' ? p.stock : 20
                });
              });
              await batch.commit();
            } else {
              const list = snapshot.docs.map(doc => {
                const data = doc.data();
                return {
                  id: doc.id,
                  ...data,
                  stock: typeof data.stock === 'number' ? data.stock : 0
                };
              });
              setProducts(list);
            }
            setIsSyncing(false);
          },
          (err) => {
            console.error('Error productos:', err);
            setSyncError('Sin conexión o permisos en Firebase.');
            setIsSyncing(false);
          }
        );

        let unsubOrders = () => {};
        if (session.role !== 'viewer') {
          unsubOrders = gradeRef.collection('pedidos')
            .orderBy('createdAt', 'desc')
            .onSnapshot(
              (snapshot) => {
                const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setOrders(list);
              },
              (err) => {
                console.error('Error pedidos:', err);
              }
            );
        }

        return () => {
          unsubProducts();
          unsubOrders();
        };
      }, [session]);

      useEffect(() => {
        if (activeOrder) {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: activeOrder.id, width: 150, height: 150 });
          }
        }
      }, [activeOrder]);

      const handleLogin = async (e) => {
        e.preventDefault();
        const cleanSchool = schoolInput.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const cleanGrade = gradeInput.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const pin = inputPin.trim();

        if (!cleanSchool || !cleanGrade) {
          setLoginError('Ingresa el nombre del Colegio y el Grado / Curso.');
          return;
        }

        if (accessMode !== 'viewer' && pin.length < 4) {
          setLoginError('El PIN debe tener al menos 4 dígitos.');
          return;
        }

        setIsLoggingIn(true);
        setLoginError('');

        try {
          const gradeDocId = `${cleanSchool}__${cleanGrade}`;
          const gradeRef = db.collection('grados_cantina').doc(gradeDocId);
          const docSnap = await gradeRef.get();

          if (accessMode === 'viewer') {
            if (!docSnap.exists) {
              setLoginError('Ese grado aún no ha sido creado.');
              setIsLoggingIn(false);
              return;
            }
            const newSession = {
              schoolId: cleanSchool,
              schoolName: docSnap.data().schoolName || schoolInput.trim(),
              gradeId: cleanGrade,
              gradeName: docSnap.data().gradeName || gradeInput.trim(),
              role: 'viewer'
            };
            localStorage.setItem('cantinapp_grade_session', JSON.stringify(newSession));
            setSession(newSession);
            setActiveTab('menu');
            return;
          }

          if (docSnap.exists) {
            const data = docSnap.data();
            if (accessMode === 'profesor') {
              if (data.profesorPin !== pin) {
                setLoginError('PIN de Profesor incorrecto.');
                setIsLoggingIn(false);
                return;
              }
            } else {
              if (data.cajaPin !== pin) {
                setLoginError('PIN de Caja / Alumnos incorrecto.');
                setIsLoggingIn(false);
                return;
              }
            }
          } else {
            await gradeRef.set({
              schoolName: schoolInput.trim(),
              gradeName: gradeInput.trim(),
              profesorPin: accessMode === 'profesor' ? pin : '1234',
              cajaPin: accessMode === 'caja' ? pin : '1234',
              createdAt: Date.now()
            });
          }

          const gradeDoc = await gradeRef.get();
          const gradeData = gradeDoc.data();

          const newSession = {
            schoolId: cleanSchool,
            schoolName: gradeData.schoolName || schoolInput.trim(),
            gradeId: cleanGrade,
            gradeName: gradeData.gradeName || gradeInput.trim(),
            role: accessMode
          };
          localStorage.setItem('cantinapp_grade_session', JSON.stringify(newSession));
          setSession(newSession);
          if (accessMode === 'profesor') setActiveTab('closing');
        } catch (err) {
          console.error(err);
          setLoginError('Error de conexión con Firebase.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (confirm('¿Deseas cerrar sesión en este grado?')) {
          localStorage.removeItem('cantinapp_grade_session');
          setSession(null);
          setProducts([]);
          setOrders([]);
          setCart([]);
        }
      };

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      const addToCart = (product) => {
        if (!isStaff) return;
        const liveProd = products.find(p => p.id === product.id) || product;
        const availableStock = liveProd.stock ?? 0;

        if (availableStock <= 0) {
          alert(`¡${product.name} está agotado!`);
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          const currentQty = existing ? existing.qty : 0;
          if (currentQty + 1 > availableStock) {
            alert(`Solo quedan ${availableStock} unidades disponibles de ${product.name}.`);
            return prev;
          }
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        if (!isStaff) return;
        const liveProd = products.find(p => p.id === id);
        const availableStock = liveProd ? (liveProd.stock ?? 0) : 999;

        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (delta > 0 && newQty > availableStock) {
              alert(`Stock máximo disponible: ${availableStock} unidades.`);
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const numericCash = Number(cashReceived) || 0;
      const changeAmount = numericCash - cartTotal;

      const handleCheckout = async () => {
        if (!isStaff || cart.length === 0) return;

        if (paymentMethod === 'Efectivo' && cashReceived !== '' && numericCash < cartTotal) {
          alert(`El efectivo recibido (₲ ${numericCash.toLocaleString()}) es menor al total a cobrar (₲ ${cartTotal.toLocaleString()}).`);
          return;
        }

        for (const item of cart) {
          const liveProd = products.find(p => p.id === item.id);
          if (liveProd && (liveProd.stock ?? 0) < item.qty) {
            alert(`Stock insuficiente para ${item.name}. Quedan ${liveProd.stock ?? 0} unidades.`);
            return;
          }
        }

        const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
        const itemsToProcess = [...cart];
        const hasCashDetails = paymentMethod === 'Efectivo' && cashReceived !== '' && numericCash >= cartTotal;

        const newOrder = {
          id: orderId,
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: Date.now(),
          items: itemsToProcess,
          total: cartTotal,
          paymentMethod,
          cashReceived: hasCashDetails ? numericCash : null,
          changeGiven: hasCashDetails ? (numericCash - cartTotal) : null,
          register: activeRegister,
          status: 'Pendiente'
        };

        setActiveOrder(newOrder);
        setCart([]);
        setCashReceived('');

        try {
          const gradeDocId = `${session.schoolId}__${session.gradeId}`;
          const gradeRef = db.collection('grados_cantina').doc(gradeDocId);
          const batch = db.batch();

          batch.set(gradeRef.collection('pedidos').doc(orderId), newOrder);

          itemsToProcess.forEach(item => {
            const prodRef = gradeRef.collection('productos').doc(item.id);
            batch.update(prodRef, {
              stock: firebase.firestore.FieldValue.increment(-item.qty)
            });
          });

          await batch.commit();
        } catch (err) {
          console.error(err);
          alert('Venta guardada localmente. Se sincronizará al volver la señal.');
        }
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!isProfessor || !productForm.name || !productForm.price) return;

        const gradeDocId = `${session.schoolId}__${session.gradeId}`;
        const gradeRef = db.collection('grados_cantina').doc(gradeDocId);
        const prodId = editingProduct ? editingProduct.id : 'p_' + Date.now();
        const parsedStock = productForm.stock === '' ? 0 : Math.max(0, Number(productForm.stock));

        const prodData = {
          id: prodId,
          name: productForm.name,
          price: Number(productForm.price),
          category: productForm.category,
          stock: parsedStock,
          image: productForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'
        };

        setEditingProduct(null);
        setProductForm({ name: '', price: '', category: 'Comida', stock: '', image: '' });

        try {
          await gradeRef.collection('productos').doc(prodId).set(prodData);
        } catch (err) {
          alert('Error al guardar producto: ' + err.message);
        }
      };

      const handleConfirmAddStock = async (e) => {
        e.preventDefault();
        if (!isStaff) return;
        const qtyToAdd = Number(stockToAdd);
        if (!stockModalProd || isNaN(qtyToAdd) || qtyToAdd === 0) return;

        const targetProd = stockModalProd;
        setStockModalProd(null);
        setStockToAdd('');

        try {
          const gradeDocId = `${session.schoolId}__${session.gradeId}`;
          await db.collection('grados_cantina').doc(gradeDocId)
            .collection('productos').doc(targetProd.id)
            .update({
              stock: firebase.firestore.FieldValue.increment(qtyToAdd)
            });
        } catch (err) {
          alert('Error al sumar stock: ' + err.message);
        }
      };

      const handleConfirmDeductStock = async (e) => {
        e.preventDefault();
        if (!isProfessor) return;
        const qtyToSub = Number(stockToDeduct);
        if (!deductModalProd || isNaN(qtyToSub) || qtyToSub <= 0) return;

        const targetProd = deductModalProd;
        if ((targetProd.stock ?? 0) < qtyToSub) {
          alert('No puedes descontar más de lo que hay en stock.');
          return;
        }

        setDeductModalProd(null);
        setStockToDeduct('');

        try {
          const gradeDocId = `${session.schoolId}__${session.gradeId}`;
          await db.collection('grados_cantina').doc(gradeDocId)
            .collection('productos').doc(targetProd.id)
            .update({
              stock: firebase.firestore.FieldValue.increment(-qtyToSub)
            });
        } catch (err) {
          alert('Error al descontar stock: ' + err.message);
        }
      };

      const startEditProduct = (prod) => {
        if (!isProfessor) return;
        setEditingProduct(prod);
        setProductForm({
          name: prod.name,
          price: prod.price,
          category: prod.category,
          stock: prod.stock ?? 0,
          image: prod.image
        });
      };

      const deleteProduct = async (id) => {
        if (!isProfessor) return;
        if (confirm('¿Eliminar este producto de este grado?')) {
          try {
            const gradeDocId = `${session.schoolId}__${session.gradeId}`;
            await db.collection('grados_cantina').doc(gradeDocId)
              .collection('productos').doc(id).delete();
          } catch (err) {
            alert('Error al eliminar: ' + err.message);
          }
        }
      };

      const updateOrderStatus = async (order, newStatus) => {
        if (!isStaff) return;
        if (newStatus === 'Cancelado' && order.status !== 'Cancelado') {
          if (!confirm(`¿Anular pedido ${order.id}? Se devolverán las unidades al stock.`)) return;
        }

        try {
          const gradeDocId = `${session.schoolId}__${session.gradeId}`;
          const gradeRef = db.collection('grados_cantina').doc(gradeDocId);
          const batch = db.batch();

          batch.update(gradeRef.collection('pedidos').doc(order.id), { status: newStatus });

          if (newStatus === 'Cancelado' && order.status !== 'Cancelado') {
            order.items.forEach(item => {
              const prodRef = gradeRef.collection('productos').doc(item.id);
              batch.update(prodRef, {
                stock: firebase.firestore.FieldValue.increment(item.qty)
              });
            });
          }

          await batch.commit();
        } catch (err) {
          alert('Error al actualizar estado: ' + err.message);
        }
      };

      const exportToExcel = async () => {
        if (!isProfessor) return;
        setIsExporting(true);
        try {
          const workbook = new ExcelJS.Workbook();
          const thinBorder = {
            top: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            left: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            right: { style: 'thin', color: { argb: 'FFD1D5DB' } }
          };

          const s1 = workbook.addWorksheet('Ventas del Grado');
          s1.mergeCells('A1:H1');
          s1.getCell('A1').value = `REPORTE - ${session.schoolName.toUpperCase()} (${session.gradeName.toUpperCase()})`;
          s1.getCell('A1').font = { size: 13, bold: true, color: { argb: 'FFFFFFFF' } };
          s1.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
          s1.getCell('A1').alignment = { horizontal: 'center', vertical: 'middle' };
          s1.getRow(1).height = 28;

          s1.columns = [
            { width: 14 }, { width: 14 }, { width: 12 }, { width: 12 },
            { width: 16 }, { width: 14 }, { width: 40 }, { width: 18 }
          ];
          const h1 = s1.getRow(3);
          h1.values = ['ID Orden', 'Fecha', 'Hora', 'Caja', 'Medio Pago', 'Estado', 'Productos', 'Total (₲)'];
          h1.eachCell(c => {
            c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
            c.border = thinBorder;
          });

          orders.forEach((o, i) => {
            const r = s1.getRow(4 + i);
            r.values = [
              o.id, o.date, o.timestamp, o.register, o.paymentMethod, o.status,
              o.items.map(it => `${it.qty}x ${it.name}`).join(', '), o.total
            ];
            r.getCell(8).numFmt = '"₲ "#,##0';
            r.eachCell(c => { c.border = thinBorder; });
          });

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Reporte_${session.schoolId}_${session.gradeId}_${new Date().toISOString().split('T')[0]}.xlsx`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          alert('Error al generar Excel: ' + err.message);
        } finally {
          setIsExporting(false);
        }
      };

      if (!session) {
        return (
          <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col justify-center p-6 shadow-lg">
            <div className="text-center mb-5">
              <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-md">
                🎓
              </div>
              <h1 className="text-2xl font-bold text-gray-800">CantinApp • Por Grados</h1>
              <p className="text-xs text-gray-500 mt-1">Gestión independiente por curso con PIN de Profesor</p>
            </div>

            <div className="grid grid-cols-3 gap-1 bg-gray-200 p-1 rounded-xl text-[11px] font-bold mb-4">
              <button
                type="button"
                onClick={() => { setAccessMode('caja'); setLoginError(''); }}
                className={`py-2 rounded-lg transition ${accessMode === 'caja' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600'}`}
              >
                🛒 Alumnos / Caja
              </button>
              <button
                type="button"
                onClick={() => { setAccessMode('profesor'); setLoginError(''); }}
                className={`py-2 rounded-lg transition ${accessMode === 'profesor' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600'}`}
              >
                👨‍🏫 Profesor (Admin)
              </button>
              <button
                type="button"
                onClick={() => { setAccessMode('viewer'); setLoginError(''); }}
                className={`py-2 rounded-lg transition ${accessMode === 'viewer' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600'}`}
              >
                👀 Menú Libre
              </button>
            </div>

            <form onSubmit={handleLogin} className="bg-blue-50/70 border border-blue-100 rounded-2xl p-5 space-y-3.5">
              <div>
                <label className="text-xs font-bold text-gray-700 block mb-1">Nombre del Colegio (Espacio):</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Colegio San José"
                  value={schoolInput}
                  onChange={(e) => setSchoolInput(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-gray-700 block mb-1">Grado / Curso:</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: 9no Grado"
                  value={gradeInput}
                  onChange={(e) => setGradeInput(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              {accessMode !== 'viewer' && (
                <div>
                  <label className="text-xs font-bold text-gray-700 block mb-1">
                    {accessMode === 'profesor' ? 'PIN del Profesor (Admin):' : 'PIN de Caja / Alumnos:'}
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    required
                    placeholder="Ej: 1234"
                    value={inputPin}
                    onChange={(e) => setInputPin(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <span className="text-[10px] text-gray-500 block mt-1">
                    {accessMode === 'profesor' 
                      ? 'Acceso para reportes, stock, edición y consumo interno.' 
                      : 'Acceso para cobrar, calcular vuelto, sumar stock y registrar pedidos.'}
                  </span>
                </div>
              )}

              {loginError && (
                <div className="bg-red-100 text-red-700 text-xs p-2.5 rounded-lg font-medium">
                  {loginError}
                </div>
              )}

              <button
                type="submit"
                disabled={isLoggingIn}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow transition disabled:opacity-50"
              >
                {isLoggingIn ? 'Conectando...' : (accessMode === 'profesor' ? 'Ingresar como Profesor' : accessMode === 'caja' ? 'Ingresar a Caja' : 'Ver Menú')}
              </button>
            </form>
          </div>
        );
      }

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const filteredOrdersDelivery = orders.filter(o =>
        o.id.toLowerCase().includes(deliverySearch.toLowerCase()) ||
        o.register.toLowerCase().includes(deliverySearch.toLowerCase())
      );

      const pendingCount = orders.filter(o => o.status === 'Pendiente').length;
      const lowStockCount = products.filter(p => (p.stock ?? 0) <= 5).length;

      const closingOrders = orders.filter(o => o.date === closingDate && (closingRegister === 'Todas' || o.register === closingRegister) && o.status !== 'Cancelado');
      const totalClosingSales = closingOrders.reduce((sum, o) => sum + o.total, 0);
      const salesByPayment = closingOrders.reduce((acc, o) => {
        acc[o.paymentMethod] = (acc[o.paymentMethod] || 0) + o.total;
        return acc;
      }, {});

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col shadow-lg">
          {/* Encabezado */}
          <header className="bg-blue-600 text-white p-3.5 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <div>
                <h1 className="text-base font-bold tracking-tight flex items-center gap-1.5">
                  🎓 {session.gradeName}
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse" title="En vivo"></span>
                </h1>
                <button onClick={handleLogout} className="text-[11px] text-blue-100 underline">
                  {session.schoolName} • {isProfessor ? 'Profesor (Admin)' : 'Caja Alumnos'} (Salir)
                </button>
              </div>
              {isStaff ? (
                <select
                  value={activeRegister}
                  onChange={(e) => setActiveRegister(e.target.value)}
                  className="bg-blue-700 text-white text-xs px-2 py-1.5 rounded font-medium border border-blue-400 focus:outline-none"
                >
                  <option value="Caja 1">Caja 1</option>
                  <option value="Caja 2">Caja 2</option>
                  <option value="Despacho">Despacho</option>
                </select>
              ) : (
                <span className="bg-blue-800 text-blue-100 text-[11px] px-2.5 py-1 rounded-full font-semibold">
                  Consulta
                </span>
              )}
            </div>

            {isStaff && (
              <nav className="flex justify-between bg-blue-700/60 p-1 rounded-lg text-xs font-medium">
                <button onClick={() => setActiveTab('menu')} className={`flex-1 py-1.5 rounded text-center transition ${activeTab === 'menu' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Menú</button>
                <button onClick={() => setActiveTab('delivery')} className={`flex-1 py-1.5 rounded text-center transition ${activeTab === 'delivery' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>
                  Despacho {pendingCount > 0 ? `(${pendingCount})` : ''}
                </button>
                <button onClick={() => setActiveTab('closing')} className={`flex-1 py-1.5 rounded text-center transition ${activeTab === 'closing' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Arqueo</button>
                <button onClick={() => setActiveTab('products')} className={`flex-1 py-1.5 rounded text-center transition ${activeTab === 'products' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>
                  Stock {lowStockCount > 0 ? `(!)` : ''}
                </button>
              </nav>
            )}
          </header>

          {syncError && (
            <div className="bg-amber-100 text-amber-900 text-xs px-4 py-2 border-b border-amber-200">
              ⚠️ {syncError}
            </div>
          )}

          <main className="flex-1 p-4 pb-36 overflow-y-auto">
            {isSyncing ? (
              <div className="text-center py-12 text-gray-500 text-sm">Sincronizando grado en vivo...</div>
            ) : (
              <>
                {/* 1. MENÚ Y COBRO */}
                {(activeTab === 'menu' || !isStaff) && (
                  <div>
                    <div className="mb-4">
                      <input
                        type="text"
                        placeholder="Buscar producto..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                      <div className="flex gap-2 overflow-x-auto mt-2 pb-1 text-xs">
                        {categories.map(cat => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-full whitespace-nowrap transition ${selectedCategory === cat ? 'bg-blue-600 text-white font-medium' : 'bg-gray-100 text-gray-600'}`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-6">
                      {filteredProducts.map(p => {
                        const stockQty = p.stock ?? 0;
                        const isOut = stockQty <= 0;
                        const inCartQty = cart.find(c => c.id === p.id)?.qty || 0;

                        return (
                          <div key={p.id} className={`bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col justify-between ${isOut ? 'opacity-70' : ''}`}>
                            <div className="relative">
                              <img src={p.image} alt={p.name} className={`h-28 w-full object-cover ${isOut ? 'grayscale' : ''}`} />
                              <span className={`absolute top-1.5 right-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm ${
                                isOut ? 'bg-red-600 text-white' :
                                stockQty <= 5 ? 'bg-amber-400 text-amber-950' : 'bg-emerald-600 text-white'
                              }`}>
                                {isOut ? 'Agotado' : `Disp: ${stockQty}`}
                              </span>
                            </div>
                            <div className="p-2 flex-1 flex flex-col justify-between">
                              <div>
                                <h3 className="font-semibold text-xs leading-tight text-gray-800">{p.name}</h3>
                                <span className="text-blue-600 font-bold text-sm">₲ {p.price.toLocaleString()}</span>
                              </div>
                              {isStaff && (
                                <button
                                  onClick={() => addToCart(p)}
                                  disabled={isOut || inCartQty >= stockQty}
                                  className={`mt-2 w-full text-xs font-semibold py-1.5 rounded-lg transition ${
                                    isOut || inCartQty >= stockQty
                                      ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                      : 'bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white'
                                  }`}
                                >
                                  {isOut ? 'Sin Stock' : (inCartQty >= stockQty ? 'Máx. en carrito' : '+ Agregar')}
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Carrito Flotante con Calculadora de Vuelto */}
                    {isStaff && cart.length > 0 && (
                      <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-3.5 shadow-2xl z-20 rounded-t-2xl max-h-[80vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-1.5">
                          <h3 className="font-bold text-xs text-gray-700">Pedido ({activeRegister})</h3>
                          <button onClick={() => { setCart([]); setCashReceived(''); }} className="text-[11px] text-red-500 underline">Vaciar</button>
                        </div>
                        <div className="max-h-24 overflow-y-auto mb-2.5 divide-y text-xs">
                          {cart.map(item => (
                            <div key={item.id} className="py-1 flex justify-between items-center">
                              <span className="font-medium text-gray-800">{item.name}</span>
                              <div className="flex items-center gap-2">
                                <button onClick={() => updateQty(item.id, -1)} className="w-5 h-5 bg-gray-200 rounded font-bold">-</button>
                                <span className="font-bold">{item.qty}</span>
                                <button onClick={() => updateQty(item.id, 1)} className="w-5 h-5 bg-gray-200 rounded font-bold">+</button>
                                <span className="w-16 text-right font-semibold">₲ {(item.price * item.qty).toLocaleString()}</span>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div className="mb-2">
                          <label className="text-[11px] font-semibold text-gray-600 block mb-1">Medio de Pago:</label>
                          <div className="grid grid-cols-3 gap-1.5 text-xs">
                            {['Efectivo', 'Transferencia', 'Tarjeta'].map(m => (
                              <button
                                key={m}
                                onClick={() => { setPaymentMethod(m); if (m !== 'Efectivo') setCashReceived(''); }}
                                className={`py-1 rounded border text-center font-medium ${paymentMethod === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-50 text-gray-700'}`}
                              >
                                {m}
                              </button>
                            ))}
                          </div>
                        </div>

                        {paymentMethod === 'Efectivo' && (
                          <div className="bg-blue-50 border border-blue-200 rounded-xl p-2.5 mb-2.5">
                            <div className="flex justify-between items-center gap-2 mb-1.5">
                              <label className="text-[11px] font-bold text-blue-900 shrink-0">Recibido (₲):</label>
                              <input
                                type="number"
                                inputMode="numeric"
                                placeholder={`Ej: ${cartTotal}`}
                                value={cashReceived}
                                onChange={(e) => setCashReceived(e.target.value)}
                                className="w-full px-2.5 py-1 border border-blue-300 rounded-lg text-sm font-bold text-right bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div className="flex gap-1 overflow-x-auto pb-1">
                              <button type="button" onClick={() => setCashReceived(String(cartTotal))} className="px-2 py-0.5 bg-white border border-blue-200 rounded text-[10px] font-bold text-blue-700 shrink-0">
                                Exacto
                              </button>
                              {[10000, 15000, 20000, 25000, 50000, 100000].map(bill => (
                                <button
                                  key={bill}
                                  type="button"
                                  onClick={() => setCashReceived(String((Number(cashReceived) || 0) + bill))}
                                  className="px-2 py-0.5 bg-white border border-blue-200 rounded text-[10px] font-semibold text-gray-700 shrink-0 hover:bg-blue-100"
                                >
                                  +{bill >= 1000 ? (bill / 1000) + 'mil' : bill}
                                </button>
                              ))}
                              {cashReceived !== '' && (
                                <button type="button" onClick={() => setCashReceived('')} className="px-2 py-0.5 bg-red-100 rounded text-[10px] font-bold text-red-700 shrink-0">
                                  Limpiar
                                </button>
                              )}
                            </div>
                            {cashReceived !== '' && (
                              <div className={`mt-1.5 pt-1.5 border-t border-blue-200 flex justify-between items-center text-xs font-extrabold ${changeAmount < 0 ? 'text-red-600' : 'text-emerald-700'}`}>
                                <span>{changeAmount < 0 ? 'Falta entregar:' : 'Vuelto a dar:'}</span>
                                <span className="text-sm">₲ {Math.abs(changeAmount).toLocaleString()}</span>
                              </div>
                            )}
                          </div>
                        )}

                        <div className="flex justify-between items-center pt-1.5 border-t mb-2.5">
                          <span className="font-bold text-gray-700 text-sm">Total:</span>
                          <span className="font-bold text-lg text-blue-600">₲ {cartTotal.toLocaleString()}</span>
                        </div>

                        <button
                          onClick={handleCheckout}
                          disabled={paymentMethod === 'Efectivo' && cashReceived !== '' && numericCash < cartTotal}
                          className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-2.5 rounded-xl text-sm shadow transition"
                        >
                          Confirmar Cobro & Descontar Stock
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* 2. DESPACHO */}
                {isStaff && activeTab === 'delivery' && (
                  <div>
                    <input
                      type="text"
                      placeholder="Buscar por # de orden..."
                      value={deliverySearch}
                      onChange={(e) => setDeliverySearch(e.target.value)}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-4"
                    />
                    {filteredOrdersDelivery.length === 0 ? (
                      <div className="text-center py-8 text-gray-400 text-xs">No hay pedidos en este grado.</div>
                    ) : (
                      <div className="space-y-3">
                        {filteredOrdersDelivery.map(order => (
                          <div key={order.id} className={`bg-white border rounded-xl p-3 shadow-sm ${order.status === 'Pendiente' ? 'border-l-4 border-l-amber-500' : ''}`}>
                            <div className="flex justify-between items-start mb-2">
                              <div>
                                <span className="font-bold text-blue-600">{order.id}</span>
                                <span className="text-xs text-gray-500 block">{order.register} • {order.timestamp} ({order.paymentMethod})</span>
                              </div>
                              <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${
                                order.status === 'Pendiente' ? 'bg-amber-100 text-amber-800' :
                                order.status === 'Entregado' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                              }`}>
                                {order.status}
                              </span>
                            </div>

                            <div className="bg-gray-50 p-2 rounded text-xs space-y-1 mb-3">
                              {order.items.map((item, idx) => (
                                <div key={idx} className="flex justify-between">
                                  <span>{item.qty}x {item.name}</span>
                                  <span className="font-medium">₲ {(item.price * item.qty).toLocaleString()}</span>
                                </div>
                              ))}
                            </div>

                            <div className="flex justify-between items-center pt-2 border-t text-xs">
                              <span className="font-bold text-gray-700">Total: ₲ {order.total.toLocaleString()}</span>
                              <div className="flex gap-1">
                                {order.status !== 'Entregado' && (
                                  <button onClick={() => updateOrderStatus(order, 'Entregado')} className="bg-emerald-600 text-white px-3 py-1 rounded font-semibold">
                                    Entregar
                                  </button>
                                )}
                                {order.status !== 'Cancelado' && (
                                  <button onClick={() => updateOrderStatus(order, 'Cancelado')} className="bg-gray-200 text-gray-700 px-2 py-1 rounded font-medium">
                                    Anular
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* 3. ARQUEO DE CAJA */}
                {isStaff && activeTab === 'closing' && (
                  <div>
                    {!isProfessor ? (
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-center">
                        <h3 className="font-bold text-sm text-amber-900 mb-1">🔒 Sección Protegida</h3>
                        <p className="text-xs text-amber-700 mb-3">El arqueo de caja y reportes están reservados exclusivamente para el Profesor Encargado.</p>
                        <button onClick={() => {
                          const pinCheck = prompt('Ingresa el PIN de Profesor para ver el arqueo:');
                          if (pinCheck) {
                            const gradeDocId = `${session.schoolId}__${session.gradeId}`;
                            db.collection('grados_cantina').doc(gradeDocId).get().then(doc => {
                              if (doc.exists && doc.data().profesorPin === pinCheck) {
                                setSession({ ...session, role: 'profesor' });
                                alert('¡Acceso concedido como Profesor!');
                              } else {
                                alert('PIN de profesor incorrecto.');
                              }
                            });
                          }
                        }} className="bg-amber-600 text-white font-bold text-xs px-4 py-2 rounded-lg">
                          Ingresar PIN de Profesor
                        </button>
                      </div>
                    ) : (
                      <div className="bg-white border rounded-xl p-4 shadow-sm">
                        <h2 className="font-bold text-base text-gray-800 border-b pb-2 mb-3">📊 Arqueo del Grado</h2>
                        <div className="grid grid-cols-2 gap-2 mb-3">
                          <div>
                            <label className="text-xs text-gray-600 block mb-1">Fecha:</label>
                            <input type="date" value={closingDate} onChange={(e) => setClosingDate(e.target.value)} className="w-full text-xs border rounded p-1.5" />
                          </div>
                          <div>
                            <label className="text-xs text-gray-600 block mb-1">Caja:</label>
                            <select value={closingRegister} onChange={(e) => setClosingRegister(e.target.value)} className="w-full text-xs border rounded p-1.5">
                              <option value="Todas">Todas</option>
                              <option value="Caja 1">Caja 1</option>
                              <option value="Caja 2">Caja 2</option>
                            </select>
                          </div>
                        </div>

                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-center mb-4">
                          <span className="text-xs text-blue-600 uppercase font-semibold">Total Recaudado en el Grado</span>
                          <div className="text-2xl font-bold text-blue-700">₲ {totalClosingSales.toLocaleString()}</div>
                          <span className="text-xs text-gray-500">{closingOrders.length} ventas válidas</span>
                        </div>

                        <div className="mb-4 text-xs space-y-1 bg-gray-50 p-2.5 rounded">
                          {['Efectivo', 'Transferencia', 'Tarjeta'].map(m => (
                            <div key={m} className="flex justify-between">
                              <span>{m}:</span>
                              <span className="font-bold">₲ {(salesByPayment[m] || 0).toLocaleString()}</span>
                            </div>
                          ))}
                        </div>

                        <div className="flex gap-2">
                          <button onClick={() => window.print()} className="flex-1 bg-gray-800 text-white py-2.5 rounded-xl font-bold text-xs">
                            🖨️ Imprimir
                          </button>
                          <button onClick={exportToExcel} disabled={isExporting} className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs">
                            {isExporting ? 'Generando...' : '📊 Exportar Excel'}
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 4. STOCK Y PRODUCTOS */}
                {isStaff && activeTab === 'products' && (
                  <div>
                    {isProfessor && (
                      <form onSubmit={handleSaveProduct} className="bg-white border rounded-xl p-3 shadow-sm mb-4 text-xs space-y-2">
                        <h3 className="font-bold text-sm text-gray-800">{editingProduct ? 'Editar Producto' : 'Nuevo Producto en el Grado'}</h3>
                        <div>
                          <label className="text-gray-600 block">Nombre:</label>
                          <input type="text" required value={productForm.name} onChange={(e) => setProductForm({ ...productForm, name: e.target.value })} className="w-full border rounded p-1.5 mt-0.5" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-gray-600 block">Precio (₲):</label>
                            <input type="number" required value={productForm.price} onChange={(e) => setProductForm({ ...productForm, price: e.target.value })} className="w-full border rounded p-1.5 mt-0.5" />
                          </div>
                          <div>
                            <label className="text-gray-600 block">Stock Inicial:</label>
                            <input type="number" min="0" required value={productForm.stock} onChange={(e) => setProductForm({ ...productForm, stock: e.target.value })} className="w-full border rounded p-1.5 mt-0.5" />
                          </div>
                        </div>
                        <div className="flex gap-2 pt-1">
                          <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-1.5 rounded">
                            {editingProduct ? 'Guardar Cambios' : 'Crear Producto'}
                          </button>
                          {editingProduct && (
                            <button type="button" onClick={() => { setEditingProduct(null); setProductForm({ name: '', price: '', category: 'Comida', stock: '', image: '' }); }} className="bg-gray-200 px-3 rounded">
                              Cancelar
                            </button>
                          )}
                        </div>
                      </form>
                    )}

                    <h3 className="font-bold text-xs text-gray-700 mb-2">Inventario del Grado:</h3>
                    <div className="space-y-2">
                      {products.map(p => {
                        const st = p.stock ?? 0;
                        return (
                          <div key={p.id} className="bg-white border rounded-lg p-2.5 flex items-center justify-between text-xs shadow-sm">
                            <div className="flex items-center gap-2">
                              <img src={p.image} alt={p.name} className="w-11 h-11 rounded-lg object-cover" />
                              <div>
                                <div className="font-bold text-gray-800">{p.name}</div>
                                <div className="text-gray-500">₲ {p.price.toLocaleString()}</div>
                                <span className={`inline-block mt-0.5 px-2 py-0.5 rounded-full text-[11px] font-bold ${
                                  st === 0 ? 'bg-red-100 text-red-700' : st <= 5 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                                }`}>
                                  Stock: {st} unid.
                                </span>
                              </div>
                            </div>
                            <div className="flex flex-col gap-1 items-end">
                              <button onClick={() => { setStockModalProd(p); setStockToAdd(''); }} className="bg-emerald-600 text-white px-2.5 py-1 rounded font-bold shadow-sm">
                                + Sumar
                              </button>

                              {isProfessor && (
                                <>
                                  <button onClick={() => { setDeductModalProd(p); setStockToDeduct(''); }} className="bg-amber-600 text-white px-2 py-0.5 rounded font-semibold">
                                    - Descontar consumo
                                  </button>
                                  <div className="flex gap-1 mt-0.5">
                                    <button onClick={() => startEditProduct(p)} className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-semibold">Editar</button>
                                    <button onClick={() => deleteProduct(p.id)} className="bg-red-100 text-red-700 px-2 py-0.5 rounded font-semibold">Borrar</button>
                                  </div>
                                </>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* MODAL SUMAR STOCK */}
          {isStaff && stockModalProd && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleConfirmAddStock} className="bg-white rounded-2xl p-5 w-full max-w-xs shadow-xl">
                <h3 className="font-bold text-base text-gray-800 mb-1">Ingresar Mercadería</h3>
                <p className="text-xs text-gray-500 mb-3">
                  Producto: <strong className="text-gray-800">{stockModalProd.name}</strong><br />
                  Stock actual: <strong className="text-emerald-700">{stockModalProd.stock ?? 0} unidades</strong>
                </p>
                <input
                  type="number"
                  required
                  min="1"
                  autoFocus
                  placeholder="Cantidad (ej: 20)"
                  value={stockToAdd}
                  onChange={(e) => setStockToAdd(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-xl text-base font-bold text-center mb-3"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => { setStockModalProd(null); setStockToAdd(''); }} className="flex-1 bg-gray-200 text-gray-700 font-bold py-2 rounded-xl text-xs">
                    Cancelar
                  </button>
                  <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">
                    Sumar Stock
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL DESCONTAR CONSUMO INTERNO */}
          {isProfessor && deductModalProd && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleConfirmDeductStock} className="bg-white rounded-2xl p-5 w-full max-w-xs shadow-xl">
                <h3 className="font-bold text-base text-gray-800 mb-1">Descontar Consumo Interno</h3>
                <p className="text-xs text-gray-500 mb-3">
                  Producto: <strong className="text-gray-800">{deductModalProd.name}</strong><br />
                  Stock disponible: <strong className="text-amber-700">{deductModalProd.stock ?? 0} unidades</strong>
                </p>
                <input
                  type="number"
                  required
                  min="1"
                  max={deductModalProd.stock ?? 0}
                  autoFocus
                  placeholder="Cantidad consumida (ej: 2)"
                  value={stockToDeduct}
                  onChange={(e) => setStockToDeduct(e.target.value)}
                  className="w-full px-3 py-2 border border-amber-300 rounded-xl text-base font-bold text-center mb-3"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => { setDeductModalProd(null); setStockToDeduct(''); }} className="flex-1 bg-gray-200 text-gray-700 font-bold py-2 rounded-xl text-xs">
                    Cancelar
                  </button>
                  <button type="submit" className="flex-1 bg-amber-600 text-white font-bold py-2 rounded-xl text-xs">
                    Descontar Stock
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL VOUCHER */}
          {isStaff && activeOrder && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-center shadow-xl">
                <div className="text-emerald-600 font-bold text-sm mb-1">¡Venta Registrada y Stock Actualizado!</div>
                <h2 className="text-xl font-bold text-gray-800">{activeOrder.id}</h2>
                <p className="text-xs text-gray-500 mb-3">{activeOrder.register} • {activeOrder.paymentMethod}</p>
                <div className="flex justify-center mb-3 bg-gray-50 p-3 rounded-xl">
                  <div id="qrcode"></div>
                </div>
                <div className="text-left bg-gray-50 p-3 rounded-xl text-xs space-y-1 mb-4">
                  {activeOrder.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between">
                      <span>{it.qty}x {it.name}</span>
                      <span className="font-semibold">₲ {(it.price * it.qty).toLocaleString()}</span>
                    </div>
                  ))}
                  <div className="flex justify-between font-bold pt-1 border-t text-blue-600 text-sm">
                    <span>Total:</span>
                    <span>₲ {activeOrder.total.toLocaleString()}</span>
                  </div>
                  {activeOrder.cashReceived !== null && (
                    <>
                      <div className="flex justify-between text-gray-600 pt-1">
                        <span>Recibido:</span>
                        <span>₲ {activeOrder.cashReceived.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between font-extrabold text-emerald-700 text-sm">
                        <span>Vuelto:</span>
                        <span>₲ {activeOrder.changeGiven.toLocaleString()}</span>
                      </div>
                    </>
                  )}
                </div>
                <button onClick={() => setActiveOrder(null)} className="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-sm">
                  Cerrar Voucher
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
