  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Empanada de Carne', price: 5000, category: 'Comida', stock: 30, image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },

      { id: 'p3', name: 'Sándwich de Jamón y Queso', price: 8000, category: 'Comida', stock: 20, image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=300&q=80' },
      { id: 'p4', name: 'Gaseosa 500ml', price: 6000, category: 'Bebida', stock: 40, image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80' },
      { id: 'p5', name: 'Jugo Natural', price: 5000, category: 'Bebida', stock: 25, image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80' },
      { id: 'p6', name: 'Agua Mineral 500ml', price: 3000, category: 'Bebida', stock: 40, image: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p7', name: 'Alfajor', price: 4000, category: 'Postre', stock: 35, image: 'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p8', name: 'Brownie', price: 5000, category: 'Postre', stock: 20, image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80' }
    ];

    function renderBarChartBase64(title, labels, values, barColor = '#2563EB') {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#E5E7EB';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      ctx.fillStyle = '#1E3A8A';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(title, 24, 34);

      if (labels.length === 0) return canvas.toDataURL('image/png');

      const padLeft = 80;
      const padRight = 30;
      const padTop = 60;
      const padBottom = 65;
      const chartW = canvas.width - padLeft - padRight;
      const chartH = canvas.height - padTop - padBottom;
      const maxVal = Math.max(...values, 1);

      ctx.strokeStyle = '#F3F4F6';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#6B7280';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'right';

      for (let i = 0; i <= 4; i++) {
        const y = padTop + chartH - (chartH * i) / 4;
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(padLeft + chartW, y);
        ctx.stroke();
        const valLabel = Math.round((maxVal * i) / 4).toLocaleString();
        ctx.fillText('₲' + valLabel, padLeft - 8, y + 4);
      }

      const step = chartW / labels.length;
      const barW = Math.min(48, step * 0.6);

      labels.forEach((label, idx) => {
        const val = values[idx];
        const barH = (val / maxVal) * chartH;
        const x = padLeft + idx * step + (step - barW) / 2;
        const y = padTop + chartH - barH;

        ctx.fillStyle = barColor;
        ctx.fillRect(x, y, barW, barH);

        ctx.fillStyle = '#111827';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('₲' + val.toLocaleString(), x + barW / 2, y - 6);

        ctx.fillStyle = '#374151';
        ctx.font = '11px sans-serif';
        const shortLabel = label.length > 14 ? label.slice(0, 13) + '…' : label;
        ctx.fillText(shortLabel, x + barW / 2, padTop + chartH + 20);
      });

      return canvas.toDataURL('image/png');
    }

    function App() {
      const [session, setSession] = useState(() => {
        const saved = localStorage.getItem('cantinapp_cloud_session');
        return saved ? JSON.parse(saved) : null;
      });
      const [accessMode, setAccessMode] = useState('staff'); // 'staff' (Equipo/Caja con PIN) | 'viewer' (Solo ver menú)
      const [loginSchool, setLoginSchool] = useState('');
      const [loginPin, setLoginPin] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      const [syncError, setSyncError] = useState('');

      const [cart, setCart] = useState([]);
      const [activeRegister, setActiveRegister] = useState(() => {
        return localStorage.getItem('app_register') || 'Caja 1';
      });

      const [activeTab, setActiveTab] = useState('menu');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [searchQuery, setSearchQuery] = useState('');
      const [deliverySearch, setDeliverySearch] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      
      const [closingDate, setClosingDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [closingRegister, setClosingRegister] = useState('Todas');
      const [closingViewMode, setClosingViewMode] = useState('daily');
      const [isExporting, setIsExporting] = useState(false);

      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ name: '', price: '', category: 'Comida', stock: '', image: '' });
      const [stockModalProd, setStockModalProd] = useState(null);
      const [stockToAdd, setStockToAdd] = useState('');

      const isStaff = session?.role === 'staff';

      useEffect(() => {
        localStorage.setItem('app_register', activeRegister);
      }, [activeRegister]);

      useEffect(() => {
        if (!session) return;

        setIsSyncing(true);
        setSyncError('');
        const spaceRef = db.collection('espacios').doc(session.spaceId);

        const unsubProducts = spaceRef.collection('productos').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty && session.role === 'staff') {
              const localProds = JSON.parse(localStorage.getItem('app_products') || 'null') || INITIAL_PRODUCTS;
              const batch = db.batch();
              localProds.forEach(p => {
                batch.set(spaceRef.collection('productos').doc(p.id), {
                  ...p,
                  stock: typeof p.stock === 'number' ? p.stock : 20
                });
              });
              await batch.commit();
            } else {
              const list = snapshot.docs.map(doc => {
                const data = doc.data();
                return {
                  id: doc.id,
                  ...data,
                  stock: typeof data.stock === 'number' ? data.stock : 0
                };
              });
              setProducts(list);
            }
            setIsSyncing(false);
          },
          (err) => {
            console.error('Error sincronizando productos:', err);
            setSyncError('Sin conexión o permisos pendientes en Firebase.');
            setIsSyncing(false);
          }
        );

        let unsubOrders = () => {};
        if (session.role === 'staff') {
          unsubOrders = spaceRef.collection('pedidos')
            .orderBy('createdAt', 'desc')
            .onSnapshot(
              (snapshot) => {
                const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setOrders(list);
              },
              (err) => {
                console.error('Error sincronizando pedidos:', err);
              }
            );
        }

        return () => {
          unsubProducts();
          unsubOrders();
        };
      }, [session]);

      useEffect(() => {
        if (activeOrder) {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
              text: activeOrder.id,
              width: 160,
              height: 160,
            });
          }
        }
      }, [activeOrder]);

      const handleJoinSpace = async (e) => {
        e.preventDefault();
        const cleanSchool = loginSchool.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const cleanPin = loginPin.trim();

        if (!cleanSchool) {
          setLoginError('Ingresa el código del colegio.');
          return;
        }

        if (accessMode === 'staff' && cleanPin.length < 4) {
          setLoginError('El PIN del equipo debe tener al menos 4 dígitos.');
          return;
        }

        setIsLoggingIn(true);
        setLoginError('');

        try {
          const spaceRef = db.collection('espacios').doc(cleanSchool);
          const docSnap = await spaceRef.get();

          if (accessMode === 'viewer') {
            if (!docSnap.exists) {
              setLoginError('Ese código de colegio aún no existe. Pide al encargado que lo cree primero.');
              setIsLoggingIn(false);
              return;
            }
            const newSession = {
              spaceId: cleanSchool,
              schoolName: docSnap.data().schoolName || loginSchool.trim(),
              role: 'viewer'
            };
            localStorage.setItem('cantinapp_cloud_session', JSON.stringify(newSession));
            setSession(newSession);
            setActiveTab('menu');
            return;
          }

          // Modo Equipo / Caja (requiere PIN)
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.pin !== cleanPin) {
              setLoginError('PIN incorrecto. Si eres alumno, elige la pestaña "Solo ver Menú".');
              setIsLoggingIn(false);
              return;
            }
          } else {
            await spaceRef.set({
              schoolName: loginSchool.trim(),
              pin: cleanPin,
              createdAt: Date.now()
            });
          }

          const newSession = {
            spaceId: cleanSchool,
            schoolName: docSnap.exists ? (docSnap.data().schoolName || loginSchool.trim()) : loginSchool.trim(),
            role: 'staff'
          };
          localStorage.setItem('cantinapp_cloud_session', JSON.stringify(newSession));
          setSession(newSession);
        } catch (err) {
          console.error(err);
          setLoginError('Error de conexión con Firebase. Revisa tu internet.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (confirm('¿Deseas salir de la sesión actual?')) {
          localStorage.removeItem('cantinapp_cloud_session');
          setSession(null);
          setProducts([]);
          setOrders([]);
          setCart([]);
        }
      };

      const handleMigrateLocalOrders = async () => {
        if (!isStaff) return;
        const localOrders = JSON.parse(localStorage.getItem('app_orders') || '[]');
        if (localOrders.length === 0) return;
        if (!confirm(`Se encontraron ${localOrders.length} ventas guardadas en este teléfono. ¿Deseas subirlas a la nube ahora?`)) return;

        try {
          const spaceRef = db.collection('espacios').doc(session.spaceId);
          const batch = db.batch();
          localOrders.forEach((o, idx) => {
            batch.set(spaceRef.collection('pedidos').doc(o.id), {
              ...o,
              createdAt: o.createdAt || (Date.now() - idx * 1000)
            });
          });
          await batch.commit();
          localStorage.removeItem('app_orders');
          alert('¡Ventas subidas y sincronizadas correctamente!');
        } catch (err) {
          alert('Error al subir ventas: ' + err.message);
        }
      };

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      const addToCart = (product) => {
        if (!isStaff) return;
        const liveProd = products.find(p => p.id === product.id) || product;
        const availableStock = liveProd.stock ?? 0;

        if (availableStock <= 0) {
          alert(`¡${product.name} está agotado!`);
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          const currentQty = existing ? existing.qty : 0;

          if (currentQty + 1 > availableStock) {
            alert(`Solo quedan ${availableStock} unidades disponibles de ${product.name}.`);
            return prev;
          }

          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        if (!isStaff) return;
        const liveProd = products.find(p => p.id === id);
        const availableStock = liveProd ? (liveProd.stock ?? 0) : 999;

        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (delta > 0 && newQty > availableStock) {
              alert(`Stock máximo disponible: ${availableStock} unidades.`);
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Solo el equipo autenticado con PIN puede confirmar ventas y descontar stock
      const handleCheckout = async () => {
        if (!isStaff || cart.length === 0) return;

        for (const item of cart) {
          const liveProd = products.find(p => p.id === item.id);
          if (liveProd && (liveProd.stock ?? 0) < item.qty) {
            alert(`Stock insuficiente para ${item.name}. Quedan ${liveProd.stock ?? 0} unidades.`);
            return;
          }
        }

        const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
        const itemsToProcess = [...cart];
        const newOrder = {
          id: orderId,
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: Date.now(),
          items: itemsToProcess,
          total: cartTotal,
          paymentMethod,
          register: activeRegister,
          status: 'Pendiente'
        };

        setActiveOrder(newOrder);
        setCart([]);

        try {
          const spaceRef = db.collection('espacios').doc(session.spaceId);
          const batch = db.batch();

          batch.set(spaceRef.collection('pedidos').doc(orderId), newOrder);

          itemsToProcess.forEach(item => {
            const prodRef = spaceRef.collection('productos').doc(item.id);
            batch.update(prodRef, {
              stock: firebase.firestore.FieldValue.increment(-item.qty)
            });
          });

          await batch.commit();
        } catch (err) {
          console.error('Error guardando pedido y actualizando stock:', err);
          alert('El pedido se guardó localmente y el stock se actualizará al recuperar señal.');
        }
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!isStaff || !productForm.name || !productForm.price) return;

        const spaceRef = db.collection('espacios').doc(session.spaceId);
        const prodId = editingProduct ? editingProduct.id : 'p_' + Date.now();
        const parsedStock = productForm.stock === '' ? 0 : Math.max(0, Number(productForm.stock));

        const prodData = {
          id: prodId,
          name: productForm.name,
          price: Number(productForm.price),
          category: productForm.category,
          stock: parsedStock,
          image: productForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'
        };

        setEditingProduct(null);
        setProductForm({ name: '', price: '', category: 'Comida', stock: '', image: '' });

        try {
          await spaceRef.collection('productos').doc(prodId).set(prodData);
        } catch (err) {
          alert('Error al guardar producto en la nube: ' + err.message);
        }
      };

      const handleConfirmAddStock = async (e) => {
        e.preventDefault();
        if (!isStaff) return;
        const qtyToAdd = Number(stockToAdd);
        if (!stockModalProd || isNaN(qtyToAdd) || qtyToAdd === 0) return;

        const targetProd = stockModalProd;
        setStockModalProd(null);
        setStockToAdd('');

        try {
          await db.collection('espacios').doc(session.spaceId)
            .collection('productos').doc(targetProd.id)
            .update({
              stock: firebase.firestore.FieldValue.increment(qtyToAdd)
            });
        } catch (err) {
          alert('Error al sumar stock: ' + err.message);
        }
      };

      const startEditProduct = (prod) => {
        if (!isStaff) return;
        setEditingProduct(prod);
        setProductForm({
          name: prod.name,
          price: prod.price,
          category: prod.category,
          stock: prod.stock ?? 0,
          image: prod.image
        });
      };

      const deleteProduct = async (id) => {
        if (!isStaff) return;
        if (confirm('¿Deseas eliminar este producto del menú en todos los dispositivos?')) {
          try {
            await db.collection('espacios').doc(session.spaceId)
              .collection('productos').doc(id).delete();
          } catch (err) {
            alert('Error al eliminar producto: ' + err.message);
          }
        }
      };

      const updateOrderStatus = async (order, newStatus) => {
        if (!isStaff) return;
        if (newStatus === 'Cancelado' && order.status !== 'Cancelado') {
          if (!confirm(`¿Anular el pedido ${order.id}? Se devolverán las unidades al stock disponible.`)) return;
        }

        try {
          const spaceRef = db.collection('espacios').doc(session.spaceId);
          const batch = db.batch();

          batch.update(spaceRef.collection('pedidos').doc(order.id), { status: newStatus });

          if (newStatus === 'Cancelado' && order.status !== 'Cancelado') {
            order.items.forEach(item => {
              const prodRef = spaceRef.collection('productos').doc(item.id);
              batch.update(prodRef, {
                stock: firebase.firestore.FieldValue.increment(item.qty)
              });
            });
          }

          await batch.commit();
        } catch (err) {
          alert('Error al actualizar estado: ' + err.message);
        }
      };

      const handleStartNewJornada = () => {
        if (confirm('¿Deseas iniciar una nueva jornada? Esto mantendrá todo el historial guardado por fechas y dejará el mostrador listo para nuevos pedidos.')) {
          setCart([]);
          setClosingDate(new Date().toISOString().split('T')[0]);
          alert('¡Nueva jornada iniciada correctamente!');
        }
      };

      const exportToExcel = async () => {
        if (!isStaff) return;
        if (orders.length === 0 && products.length === 0) {
          alert('No hay datos registrados para exportar.');
          return;
        }

        setIsExporting(true);
        try {
          const workbook = new ExcelJS.Workbook();
          workbook.creator = 'CantinApp';
          workbook.created = new Date();

          const thinBorder = {
            top: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            left: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            right: { style: 'thin', color: { argb: 'FFD1D5DB' } }
          };

          const sheetDetail = workbook.addWorksheet('Ventas Detalladas', {
            views: [{ state: 'frozen', ySplit: 3 }]
          });

          sheetDetail.mergeCells('A1:H1');
          const titleCell = sheetDetail.getCell('A1');
          titleCell.value = `REPORTE DE VENTAS - ${session.schoolName.toUpperCase()}`;
          titleCell.font = { size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
          titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
          titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
          sheetDetail.getRow(1).height = 30;

          sheetDetail.columns = [
            { key: 'id', width: 14 },
            { key: 'date', width: 14 },
            { key: 'timestamp', width: 12 },
            { key: 'register', width: 12 },
            { key: 'paymentMethod', width: 16 },
            { key: 'status', width: 14 },
            { key: 'items', width: 42 },
            { key: 'total', width: 18 }
          ];

          const headerRow = sheetDetail.getRow(3);
          headerRow.values = ['ID Orden', 'Fecha', 'Hora', 'Caja', 'Medio de Pago', 'Estado', 'Detalle de Productos', 'Total (₲)'];
          headerRow.height = 24;
          headerRow.eachCell((cell) => {
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
            cell.border = thinBorder;
          });

          orders.forEach((o, index) => {
            const rowNum = index + 4;
            const row = sheetDetail.getRow(rowNum);
            const itemsStr = o.items.map(i => `${i.qty}x ${i.name}`).join(', ');
            row.values = [o.id, o.date, o.timestamp, o.register, o.paymentMethod, o.status, itemsStr, o.total];
            row.height = 22;

            const isEven = index % 2 === 1;
            const bgColor = o.status === 'Cancelado' ? 'FFFEE2E2' : (isEven ? 'FFEFF6FF' : 'FFFFFFFF');

            row.eachCell((cell, colNumber) => {
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              cell.border = thinBorder;
              cell.alignment = { vertical: 'middle', horizontal: colNumber === 7 ? 'left' : (colNumber === 8 ? 'right' : 'center') };
              if (colNumber === 8) {
                cell.numFmt = '"₲ "#,##0';
                cell.font = { bold: true, color: { argb: o.status === 'Cancelado' ? 'FF991B1B' : 'FF111827' } };
              }
            });
          });

          if (orders.length > 0) {
            const lastDataRow = orders.length + 3;
            const totalRowNum = lastDataRow + 1;
            const totalRow = sheetDetail.getRow(totalRowNum);
            totalRow.height = 26;
            sheetDetail.mergeCells(`A${totalRowNum}:G${totalRowNum}`);
            totalRow.getCell(1).value = 'TOTAL GENERAL ACUMULADO';
            totalRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
            totalRow.getCell(8).value = { formula: `SUM(H4:H${lastDataRow})` };
            totalRow.getCell(8).numFmt = '"₲ "#,##0';
            totalRow.getCell(8).alignment = { horizontal: 'right', vertical: 'middle' };

            for (let c = 1; c <= 8; c++) {
              const cell = totalRow.getCell(c);
              cell.font = { bold: true, size: 11, color: { argb: 'FF1E3A8A' } };
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDBEAFE' } };
              cell.border = {
                top: { style: 'medium', color: { argb: 'FF2563EB' } },
                bottom: { style: 'double', color: { argb: 'FF2563EB' } },
                left: thinBorder.left,
                right: thinBorder.right
              };
            }
          }

          const sheetSummary = workbook.addWorksheet('Resumen y Gráficos');
          sheetSummary.columns = [
            { width: 28 },
            { width: 16 },
            { width: 20 },
            { width: 4 },
            { width: 24 },
            { width: 20 }
          ];

          sheetSummary.mergeCells('A1:F1');
          const sumTitle = sheetSummary.getCell('A1');
          sumTitle.value = 'RESUMEN EJECUTIVO Y GRÁFICOS COMPARATIVOS';
          sumTitle.font = { size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
          sumTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
          sumTitle.alignment = { horizontal: 'center', vertical: 'middle' };
          sheetSummary.getRow(1).height = 30;

          const validOrders = orders.filter(o => o.status !== 'Cancelado');

          sheetSummary.getCell('A3').value = '1. COMPARATIVO POR FECHA';
          sheetSummary.getCell('A3').font = { bold: true, size: 11, color: { argb: 'FF1E3A8A' } };

          const dateHeader = sheetSummary.getRow(4);
          dateHeader.getCell(1).value = 'Fecha';
          dateHeader.getCell(2).value = 'Pedidos';
          dateHeader.getCell(3).value = 'Recaudado (₲)';
          [1, 2, 3].forEach(c => {
            const cell = dateHeader.getCell(c);
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;
          });

          const byDate = {};
          validOrders.forEach(o => {
            if (!byDate[o.date]) byDate[o.date] = { count: 0, total: 0 };
            byDate[o.date].count += 1;
            byDate[o.date].total += o.total;
          });
          const sortedDates = Object.keys(byDate).sort();

          sortedDates.forEach((d, i) => {
            const r = sheetSummary.getRow(5 + i);
            r.getCell(1).value = d;
            r.getCell(2).value = byDate[d].count;
            r.getCell(3).value = byDate[d].total;
            r.getCell(3).numFmt = '"₲ "#,##0';
            [1, 2, 3].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFEFF6FF' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 3 ? 'right' : 'center' };
            });
          });

          sheetSummary.getCell('E3').value = '2. MEDIOS DE PAGO';
          sheetSummary.getCell('E3').font = { bold: true, size: 11, color: { argb: 'FF065F46' } };

          const payHeader = sheetSummary.getRow(4);
          payHeader.getCell(5).value = 'Medio de Pago';
          payHeader.getCell(6).value = 'Total (₲)';
          [5, 6].forEach(c => {
            const cell = payHeader.getCell(c);
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF059669' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;
          });

          const byPay = {};
          validOrders.forEach(o => {
            byPay[o.paymentMethod] = (byPay[o.paymentMethod] || 0) + o.total;
          });
          const payKeys = Object.keys(byPay);

          payKeys.forEach((m, i) => {
            const r = sheetSummary.getRow(5 + i);
            r.getCell(5).value = m;
            r.getCell(6).value = byPay[m];
            r.getCell(6).numFmt = '"₲ "#,##0';
            [5, 6].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFECFDF5' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 6 ? 'right' : 'center' };
            });
          });

          const prodStartRow = Math.max(sortedDates.length, payKeys.length) + 7;
          sheetSummary.getCell(`A${prodStartRow}`).value = '3. RANKING DE PRODUCTOS MÁS VENDIDOS';
          sheetSummary.getCell(`A${prodStartRow}`).font = { bold: true, size: 11, color: { argb: 'FF92400E' } };

          const prodHeader = sheetSummary.getRow(prodStartRow + 1);
          prodHeader.getCell(1).value = 'Producto';
          prodHeader.getCell(2).value = 'Unidades';
          prodHeader.getCell(3).value = 'Total Generado (₲)';
          [1, 2, 3].forEach(c => {
            const cell = prodHeader.getCell(c);
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD97706' } };
            cell.alignment = { horizontal: 'center' };
            cell.border = thinBorder;
          });

          const byProd = {};
          validOrders.forEach(o => {
            o.items.forEach(it => {
              if (!byProd[it.name]) byProd[it.name] = { qty: 0, total: 0 };
              byProd[it.name].qty += it.qty;
              byProd[it.name].total += it.qty * it.price;
            });
          });
          const sortedProds = Object.entries(byProd).sort((a, b) => b[1].total - a[1].total);

          sortedProds.forEach(([name, data], i) => {
            const r = sheetSummary.getRow(prodStartRow + 2 + i);
            r.getCell(1).value = name;
            r.getCell(2).value = data.qty;
            r.getCell(3).value = data.total;
            r.getCell(3).numFmt = '"₲ "#,##0';
            [1, 2, 3].forEach(c => {
              const cell = r.getCell(c);
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i % 2 === 1 ? 'FFFFFBEB' : 'FFFFFFFF' } };
              cell.alignment = { horizontal: c === 1 ? 'left' : (c === 3 ? 'right' : 'center') };
            });
          });

          const chartStartRow = prodStartRow + sortedProds.length + 3;

          if (sortedDates.length > 0) {
            const dateChartBase64 = renderBarChartBase64(
              'Evolución de Ventas por Fecha (₲)',
              sortedDates.slice(-8),
              sortedDates.slice(-8).map(d => byDate[d].total),
              '#2563EB'
            );
            const dateImgId = workbook.addImage({ base64: dateChartBase64, extension: 'png' });
            sheetSummary.addImage(dateImgId, {
              tl: { col: 0, row: chartStartRow },
              ext: { width: 520, height: 290 }
            });
          }

          if (sortedProds.length > 0) {
            const topProds = sortedProds.slice(0, 6);
            const prodChartBase64 = renderBarChartBase64(
              'Top Productos por Recaudación (₲)',
              topProds.map(p => p[0]),
              topProds.map(p => p[1].total),
              '#D97706'
            );
            const prodImgId = workbook.addImage({ base64: prodChartBase64, extension: 'png' });
            sheetSummary.addImage(prodImgId, {
              tl: { col: 0, row: chartStartRow + 16 },
              ext: { width: 520, height: 290 }
            });
          }

          const sheetStock = workbook.addWorksheet('Inventario Actual');
          sheetStock.columns = [
            { width: 30 },
            { width: 16 },
            { width: 18 },
            { width: 18 },
            { width: 18 }
          ];

          sheetStock.mergeCells('A1:E1');
          const stockTitle = sheetStock.getCell('A1');
          stockTitle.value = 'CONTROL DE INVENTARIO Y STOCK DISPONIBLE';
          stockTitle.font = { size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
          stockTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF065F46' } };
          stockTitle.alignment = { horizontal: 'center', vertical: 'middle' };
          sheetStock.getRow(1).height = 30;

          const stockHeader = sheetStock.getRow(3);
          stockHeader.values = ['Producto', 'Categoría', 'Precio Unit. (₲)', 'Stock Restante', 'Estado'];
          stockHeader.height = 24;
          stockHeader.eachCell(cell => {
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF059669' } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
            cell.border = thinBorder;
          });

          products.forEach((p, idx) => {
            const r = sheetStock.getRow(4 + idx);
            const st = p.stock ?? 0;
            const statusText = st === 0 ? 'AGOTADO' : (st <= 5 ? 'STOCK BAJO' : 'DISPONIBLE');
            r.values = [p.name, p.category, p.price, st, statusText];
            r.height = 22;

            const bg = st === 0 ? 'FFFEE2E2' : (st <= 5 ? 'FFFEF3C7' : (idx % 2 === 1 ? 'FFECFDF5' : 'FFFFFFFF'));
            r.eachCell((cell, col) => {
              cell.border = thinBorder;
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } };
              cell.alignment = { vertical: 'middle', horizontal: col === 1 ? 'left' : (col === 3 ? 'right' : 'center') };
              if (col === 3) cell.numFmt = '"₲ "#,##0';
              if (col === 4 || col === 5) cell.font = { bold: true };
            });
          });

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `Reporte_${session.spaceId}_${new Date().toISOString().split('T')[0]}.xlsx`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error('Error al generar Excel:', err);
          alert('Hubo un problema al generar el archivo Excel.');
        } finally {
          setIsExporting(false);
        }
      };

      // PANTALLA DE INGRESO CON SEPARACIÓN DE ROL (EQUIPO/CAJA CON PIN VS. SOLO VER MENÚ)
      if (!session) {
        return (
          <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col justify-center p-6 shadow-lg">
            <div className="text-center mb-5">
              <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-md">
                🎓
              </div>
              <h1 className="text-2xl font-bold text-gray-800">CantinApp</h1>
              <p className="text-xs text-gray-500 mt-1">Gestión de ventas, stock y despacho en vivo</p>
            </div>

            <div className="flex bg-gray-200 p-1 rounded-xl text-xs font-bold mb-4">
              <button
                type="button"
                onClick={() => { setAccessMode('staff'); setLoginError(''); }}
                className={`flex-1 py-2 rounded-lg transition ${accessMode === 'staff' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600'}`}
              >
                🔐 Equipo / Caja (Con PIN)
              </button>
              <button
                type="button"
                onClick={() => { setAccessMode('viewer'); setLoginError(''); }}
                className={`flex-1 py-2 rounded-lg transition ${accessMode === 'viewer' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600'}`}
              >
                👀 Solo Ver Menú
              </button>
            </div>

            <form onSubmit={handleJoinSpace} className="bg-blue-50/70 border border-blue-100 rounded-2xl p-5 space-y-4">
              <div>
                <label className="text-xs font-bold text-gray-700 block mb-1">Código del Colegio / Evento:</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: colegio-san-jose"
                  value={loginSchool}
                  onChange={(e) => setLoginSchool(e.target.value)}
                  className="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              {accessMode === 'staff' ? (
                <div>
                  <label className="text-xs font-bold text-gray-700 block mb-1">PIN de Caja / Encargados:</label>
                  <input
                    type="password"
                    inputMode="numeric"
                    required
                    placeholder="Ej: 1234"
                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value)}
                    className="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <span className="text-[11px] text-gray-500 block mt-1">
                    Solo quienes tengan este PIN pueden cobrar, descontar stock o despachar.
                  </span>
                </div>
              ) : (
                <div className="bg-white/80 border border-blue-100 rounded-xl p-3 text-xs text-gray-600">
                  Modo consulta para alumnos: muestra precios y productos disponibles en vivo, <strong>sin permitir cobrar ni modificar el stock</strong>.
                </div>
              )}

              {loginError && (
                <div className="bg-red-100 text-red-700 text-xs p-2.5 rounded-lg font-medium">
                  {loginError}
                </div>
              )}

              <button
                type="submit"
                disabled={isLoggingIn}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow transition disabled:opacity-50"
              >
                {isLoggingIn ? 'Conectando...' : (accessMode === 'staff' ? 'Ingresar como Caja / Equipo' : 'Ver Menú Disponible')}
              </button>
            </form>
          </div>
        );
      }

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const filteredOrdersDelivery = orders.filter(o => 
        o.id.toLowerCase().includes(deliverySearch.toLowerCase()) || 
        o.register.toLowerCase().includes(deliverySearch.toLowerCase())
      );

      const pendingCount = orders.filter(o => o.status === 'Pendiente').length;
      const lowStockCount = products.filter(p => (p.stock ?? 0) <= 5).length;

      const closingOrders = orders.filter(o => {
        const matchesDate = o.date === closingDate;
        const matchesReg = closingRegister === 'Todas' || o.register === closingRegister;
        return matchesDate && matchesReg && o.status !== 'Cancelado';
      });

      const totalClosingSales = closingOrders.reduce((sum, o) => sum + o.total, 0);
      
      const salesByPayment = closingOrders.reduce((acc, o) => {
        acc[o.paymentMethod] = (acc[o.paymentMethod] || 0) + o.total;
        return acc;
      }, {});

      const productSalesMap = {};
      closingOrders.forEach(o => {
        o.items.forEach(item => {
          if (!productSalesMap[item.name]) {
            productSalesMap[item.name] = { qty: 0, subtotal: 0, price: item.price };
          }
          productSalesMap[item.name].qty += item.qty;
          productSalesMap[item.name].subtotal += (item.qty * item.price);
        });
      });

      const historyByDateMap = {};
      orders.filter(o => o.status !== 'Cancelado').forEach(o => {
        if (!historyByDateMap[o.date]) {
          historyByDateMap[o.date] = { date: o.date, total: 0, ordersCount: 0 };
        }
        historyByDateMap[o.date].total += o.total;
        historyByDateMap[o.date].ordersCount += 1;
      });
      const historyList = Object.values(historyByDateMap).sort((a, b) => b.date.localeCompare(a.date));

      const hasLegacyLocalOrders = isStaff && JSON.parse(localStorage.getItem('app_orders') || '[]').length > 0;

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col shadow-lg">
          {/* Encabezado */}
          <header className="bg-blue-600 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <div>
                <h1 className="text-lg font-bold tracking-tight flex items-center gap-1.5">
                  🎓 CantinApp
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse" title="Conectado en vivo"></span>
                </h1>
                <button onClick={handleLogout} className="text-[11px] text-blue-100 underline">
                  {session.schoolName} • {isStaff ? 'Modo Caja' : 'Solo Consulta'} (Salir)
                </button>
              </div>
              {isStaff ? (
                <select 
                  value={activeRegister} 
                  onChange={(e) => setActiveRegister(e.target.value)}
                  className="bg-blue-700 text-white text-xs px-2 py-1.5 rounded font-medium border border-blue-400 focus:outline-none"
                >
                  <option value="Caja 1">Caja 1</option>
                  <option value="Caja 2">Caja 2</option>
                  <option value="Caja 3">Caja 3</option>
                  <option value="Despacho">Despacho</option>
                </select>

                <span className="bg-blue-800/80 text-blue-100 text-[11px] px-2.5 py-1 rounded-full font-semibold">
                  Solo lectura
                </span>
              )}
            </div>
            
            {isStaff && (
              <nav className="flex justify-between bg-blue-700/60 p-1 rounded-lg text-xs font-medium">
                <button onClick={() => setActiveTab('menu')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'menu' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Menú</button>
                <button onClick={() => setActiveTab('delivery')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'delivery' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>
                  Despacho
                  {pendingCount > 0 && (
                    <span className="ml-1 bg-amber-400 text-amber-950 text-[10px] font-extrabold px-1.5 py-0.2 rounded-full">
                      {pendingCount}
                    </span>
                  )}
                </button>
                <button onClick={() => setActiveTab('closing')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'closing' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Cierre</button>
                <button onClick={() => setActiveTab('products')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'products' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>
                  Stock/Prod
                  {lowStockCount > 0 && (
                    <span className="ml-1 bg-rose-400 text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded-full">
                      {lowStockCount}
                    </span>
                  )}
                </button>
              </nav>
            )}
          </header>

          {syncError && (
            <div className="bg-amber-100 text-amber-900 text-xs px-4 py-2 border-b border-amber-200">
              ⚠️ {syncError}
            </div>
          )}

          {hasLegacyLocalOrders && (
            <div className="bg-indigo-50 text-indigo-900 text-xs px-4 py-2.5 border-b border-indigo-200 flex justify-between items-center">
              <span>Tienes ventas locales anteriores sin subir.</span>
              <button onClick={handleMigrateLocalOrders} className="bg-indigo-600 text-white px-2.5 py-1 rounded font-bold">
                Subir ahora
              </button>
            </div>
          )}

          <main className="flex-1 p-4 pb-24 overflow-y-auto">
            {isSyncing ? (
              <div className="text-center py-12 text-gray-500 text-sm">
                Sincronizando catálogo y disponibilidad en vivo...
              </div>
            ) : (
              <>
                {/* PESTAÑA MENÚ */}
                {(activeTab === 'menu' || !isStaff) && (
                  <div>
                    <div className="mb-4">
                      <input 
                        type="text" 
                        placeholder="Buscar producto..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                      <div className="flex gap-2 overflow-x-auto mt-2 pb-1 text-xs">
                        {categories.map(cat => (
                          <button 
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-full whitespace-nowrap transition ${selectedCategory === cat ? 'bg-blue-600 text-white font-medium' : 'bg-gray-100 text-gray-600'}`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-6">
                      {filteredProducts.map(p => {
                        const stockQty = p.stock ?? 0;
                        const isOut = stockQty <= 0;
                        const inCartQty = cart.find(c => c.id === p.id)?.qty || 0;

                        return (
                          <div key={p.id} className={`bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col justify-between relative ${isOut ? 'opacity-70' : ''}`}>
                            <div className="relative">
                              <img src={p.image} alt={p.name} className={`h-28 w-full object-cover ${isOut ? 'grayscale' : ''}`} />
                              <span className={`absolute top-1.5 right-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm ${
                                isOut ? 'bg-red-600 text-white' :
                                stockQty <= 5 ? 'bg-amber-400 text-amber-950' : 'bg-emerald-600 text-white'
                              }`}>
                                {isOut ? 'Agotado' : `Disp: ${stockQty}`}
                              </span>
                            </div>
                            <div className="p-2 flex-1 flex flex-col justify-between">
                              <div>
                                <h3 className="font-semibold text-xs leading-tight text-gray-800">{p.name}</h3>
                                <span className="text-blue-600 font-bold text-sm">₲ {p.price.toLocaleString()}</span>
                              </div>
                              {isStaff && (
                                <button 
                                  onClick={() => addToCart(p)}
                                  disabled={isOut || inCartQty >= stockQty}
                                  className={`mt-2 w-full text-xs font-semibold py-1.5 rounded-lg transition ${
                                    isOut || inCartQty >= stockQty
                                      ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                      : 'bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white'
                                  }`}
                                >
                                  {isOut ? 'Sin Stock' : (inCartQty >= stockQty ? 'Máx. en carrito' : '+ Agregar')}
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
