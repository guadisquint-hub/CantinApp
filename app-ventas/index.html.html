<!DOCTYPE html>
<html lang="es">
<head>
<!-- Favicon e Íconos -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="shortcut icon" href="./favicon.ico">
  
  <!-- Configuración PWA (Asegúrate de que ya estén estas líneas) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="./favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Ventas Escolares</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- React y React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA lista y registrada', reg.scope))
          .catch(err => console.log('Error al registrar PWA', err));
      });
    }
  </script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Empanada de Carne', price: 5000, category: 'Comida', image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },
      { id: 'p2', name: 'Empanada de Queso', price: 4500, category: 'Comida', image: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=300&q=80' },
      { id: 'p3', name: 'Sándwich de Jamón y Queso', price: 8000, category: 'Comida', image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=300&q=80' },
      { id: 'p4', name: 'Gaseosa 500ml', price: 6000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80' },
      { id: 'p5', name: 'Jugo Natural', price: 5000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80' },
      { id: 'p6', name: 'Agua Mineral 500ml', price: 3000, category: 'Bebida', image: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p7', name: 'Alfajor', price: 4000, category: 'Postre', image: 'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=300&q=80' },
      { id: 'p8', name: 'Brownie', price: 5000, category: 'Postre', image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80' }
    ];

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('app_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [cart, setCart] = useState([]);
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('app_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeRegister, setActiveRegister] = useState(() => {
        return localStorage.getItem('app_register') || 'Caja 1';
      });

      const [activeTab, setActiveTab] = useState('menu');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [searchQuery, setSearchQuery] = useState('');
      const [deliverySearch, setDeliverySearch] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      
      const [closingDate, setClosingDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [closingRegister, setClosingRegister] = useState('Todas');

      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ name: '', price: '', category: 'Comida', image: '' });

      useEffect(() => {
        localStorage.setItem('app_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('app_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('app_register', activeRegister);
      }, [activeRegister]);

      useEffect(() => {
        if (activeOrder) {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
              text: activeOrder.id,
              width: 160,
              height: 160,
            });
          }
        }
      }, [activeOrder]);

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const handleCheckout = () => {
        if (cart.length === 0) return;
        const newOrder = {
          id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          items: cart,
          total: cartTotal,
          paymentMethod,
          register: activeRegister,
          status: 'Pendiente'
        };

        setOrders(prev => [newOrder, ...prev]);
        setActiveOrder(newOrder);
        setCart([]);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.name || !productForm.price) return;

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? {
            ...p,
            name: productForm.name,
            price: Number(productForm.price),
            category: productForm.category,
            image: productForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'
          } : p));
        } else {
          const newProd = {
            id: 'p_' + Date.now(),
            name: productForm.name,
            price: Number(productForm.price),
            category: productForm.category,
            image: productForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'
          };
          setProducts(prev => [...prev, newProd]);
        }
        setEditingProduct(null);
        setProductForm({ name: '', price: '', category: 'Comida', image: '' });
      };

      const startEditProduct = (prod) => {
        setEditingProduct(prod);
        setProductForm({ name: prod.name, price: prod.price, category: prod.category, image: prod.image });
      };

      const deleteProduct = (id) => {
        if (confirm('¿Deseas eliminar este producto del menú?')) {
          setProducts(prev => prev.filter(p => p.id !== id));
        }
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
      };

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const filteredOrdersDelivery = orders.filter(o => 
        o.id.toLowerCase().includes(deliverySearch.toLowerCase()) || 
        o.register.toLowerCase().includes(deliverySearch.toLowerCase())
      );

      const closingOrders = orders.filter(o => {
        const matchesDate = o.date === closingDate;
        const matchesReg = closingRegister === 'Todas' || o.register === closingRegister;
        return matchesDate && matchesReg && o.status !== 'Cancelado';
      });

      const totalClosingSales = closingOrders.reduce((sum, o) => sum + o.total, 0);
      
      const salesByPayment = closingOrders.reduce((acc, o) => {
        acc[o.paymentMethod] = (acc[o.paymentMethod] || 0) + o.total;
        return acc;
      }, {});

      const productSalesMap = {};
      closingOrders.forEach(o => {
        o.items.forEach(item => {
          if (!productSalesMap[item.name]) {
            productSalesMap[item.name] = { qty: 0, subtotal: 0, price: item.price };
          }
          productSalesMap[item.name].qty += item.qty;
          productSalesMap[item.name].subtotal += (item.qty * item.price);
        });
      });

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col shadow-lg">
          {/* Encabezado */}
          <header className="bg-blue-600 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <h1 className="text-xl font-bold tracking-tight flex items-center gap-2">
                🎓 Ventas Escolares
              </h1>
              <select 
                value={activeRegister} 
                onChange={(e) => setActiveRegister(e.target.value)}
                className="bg-blue-700 text-white text-xs px-2 py-1 rounded font-medium border border-blue-400 focus:outline-none"
              >
                <option value="Caja 1">Caja 1</option>
                <option value="Caja 2">Caja 2</option>
                <option value="Caja 3">Caja 3</option>
              </select>
            </div>
            
            <nav className="flex justify-between bg-blue-700/60 p-1 rounded-lg text-xs font-medium">
              <button onClick={() => setActiveTab('menu')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'menu' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Menú</button>
              <button onClick={() => setActiveTab('delivery')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'delivery' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Despacho</button>
              <button onClick={() => setActiveTab('closing')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'closing' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Cierre</button>
              <button onClick={() => setActiveTab('products')} className={`flex-1 py-1.5 rounded-md text-center transition ${activeTab === 'products' ? 'bg-white text-blue-700 font-bold' : 'text-blue-100'}`}>Productos</button>
            </nav>
          </header>

          <main className="flex-1 p-4 pb-24 overflow-y-auto">
            {/* PESTAÑA MENÚ */}
            {activeTab === 'menu' && (
              <div>
                <div className="mb-4">
                  <input 
                    type="text" 
                    placeholder="Buscar producto..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <div className="flex gap-2 overflow-x-auto mt-2 pb-1 text-xs">
                    {categories.map(cat => (
                      <button 
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1.5 rounded-full whitespace-nowrap transition ${selectedCategory === cat ? 'bg-blue-600 text-white font-medium' : 'bg-gray-100 text-gray-600'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-6">
                  {filteredProducts.map(p => (
                    <div key={p.id} className="bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
                      <img src={p.image} alt={p.name} className="h-28 w-full object-cover" />
                      <div className="p-2 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 className="font-semibold text-xs leading-tight text-gray-800">{p.name}</h3>
                          <span className="text-blue-600 font-bold text-sm">₲ {p.price.toLocaleString()}</span>
                        </div>
                        <button 
                          onClick={() => addToCart(p)}
                          className="mt-2 w-full bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white text-xs font-semibold py-1.5 rounded-lg transition"
                        >
                          + Agregar
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {cart.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 shadow-2xl z-20 rounded-t-2xl">
                    <h3 className="font-bold text-sm mb-2 text-gray-700">Resumen del Pedido</h3>
                    <div className="max-h-32 overflow-y-auto mb-3 divide-y text-xs">
                      {cart.map(item => (
                        <div key={item.id} className="py-1.5 flex justify-between items-center">
                          <span className="font-medium text-gray-800">{item.name}</span>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQty(item.id, -1)} className="w-5 h-5 bg-gray-200 rounded font-bold text-gray-600 flex items-center justify-center">-</button>
                            <span className="font-bold">{item.qty}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-5 h-5 bg-gray-200 rounded font-bold text-gray-600 flex items-center justify-center">+</button>
                            <span className="w-16 text-right font-semibold">₲ {(item.price * item.qty).toLocaleString()}</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="mb-3">
                      <label className="text-xs font-semibold text-gray-600 block mb-1">Medio de Pago:</label>
                      <div className="grid grid-cols-3 gap-2 text-xs">
                        {['Efectivo', 'Transferencia', 'Tarjeta'].map(m => (
                          <button
                            key={m}
                            onClick={() => setPaymentMethod(m)}
                            className={`py-1 rounded border text-center font-medium ${paymentMethod === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-50 text-gray-700'}`}
                          >
                            {m}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex justify-between items-center pt-2 border-t mb-3">
                      <span className="font-bold text-gray-700 text-sm">Total:</span>
                      <span className="font-bold text-lg text-blue-600">₲ {cartTotal.toLocaleString()}</span>
                    </div>

                    <button 
                      onClick={handleCheckout}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition"
                    >
                      Confirmar Pedido & Generar QR
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PESTAÑA DESPACHO */}
            {activeTab === 'delivery' && (
              <div>
                <input 
                  type="text" 
                  placeholder="Buscar por # de orden o caja..." 
                  value={deliverySearch}
                  onChange={(e) => setDeliverySearch(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />

                <div className="space-y-3">
                  {filteredOrdersDelivery.map(order => (
                    <div key={order.id} className="bg-white border rounded-xl p-3 shadow-sm">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="font-bold text-blue-600">{order.id}</span>
                          <span className="text-xs text-gray-500 block">{order.register} • {order.timestamp}</span>
                        </div>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${
                          order.status === 'Pendiente' ? 'bg-amber-100 text-amber-800' :
                          order.status === 'Entregado' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                        }`}>
                          {order.status}
                        </span>
                      </div>

                      <div className="bg-gray-50 p-2 rounded text-xs space-y-1 mb-3">
                        {order.items.map((item, idx) => (
                          <div key={idx} className="flex justify-between">
                            <span>{item.qty}x {item.name}</span>
                            <span className="font-medium">₲ {(item.price * item.qty).toLocaleString()}</span>
                          </div>
                        ))}
                      </div>

                      <div className="flex justify-between items-center pt-2 border-t text-xs">
                        <span className="font-bold text-gray-700">Total: ₲ {order.total.toLocaleString()}</span>
                        <div className="flex gap-1">
                          {order.status !== 'Entregado' && (
                            <button 
                              onClick={() => updateOrderStatus(order.id, 'Entregado')}
                              className="bg-green-600 text-white px-3 py-1 rounded font-semibold"
                            >
                              Marcar Entregado
                            </button>
                          )}
                          {order.status !== 'Cancelado' && (
                            <button 
                              onClick={() => updateOrderStatus(order.id, 'Cancelado')}
                              className="bg-gray-200 text-gray-700 px-2 py-1 rounded font-medium"
                            >
                              Anular
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PESTAÑA CIERRE DE CAJA */}
            {activeTab === 'closing' && (
              <div>
                <div id="printable-area">
                  <div className="bg-white border rounded-xl p-4 shadow-sm mb-4">
                    <h2 className="font-bold text-base text-gray-800 mb-3 border-b pb-2">📊 Cierre de Caja</h2>
                    
                    <div className="grid grid-cols-2 gap-2 mb-4 no-print">
                      <div>
                        <label className="text-xs text-gray-600 block mb-1">Fecha:</label>
                        <input 
                          type="date" 
                          value={closingDate}
                          onChange={(e) => setClosingDate(e.target.value)}
                          className="w-full text-xs border rounded p-1.5"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-gray-600 block mb-1">Filtrar Caja:</label>
                        <select 
                          value={closingRegister} 
                          onChange={(e) => setClosingRegister(e.target.value)}
                          className="w-full text-xs border rounded p-1.5"
                        >
                          <option value="Todas">Todas</option>
                          <option value="Caja 1">Caja 1</option>
                          <option value="Caja 2">Caja 2</option>
                          <option value="Caja 3">Caja 3</option>
                        </select>
                      </div>
                    </div>

                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-center mb-4">
                      <span className="text-xs text-blue-700 uppercase font-semibold">Total Recaudado</span>
                      <div className="text-2xl font-bold text-blue-700">₲ {totalClosingSales.toLocaleString()}</div>
                      <span className="text-xs text-gray-500">{closingOrders.length} pedidos procesados</span>
                    </div>

                    <h3 className="font-bold text-xs text-gray-700 mb-2">Desglose por Medio de Pago:</h3>
                    <div className="grid grid-cols-3 gap-2 mb-4 text-xs">
                      <div className="bg-gray-50 p-2 rounded text-center">
                        <span className="text-gray-500 block">Efectivo</span>
                        <span className="font-bold">₲ {(salesByPayment['Efectivo'] || 0).toLocaleString()}</span>
                      </div>
                      <div className="bg-gray-50 p-2 rounded text-center">
                        <span className="text-gray-500 block">Transf.</span>
                        <span className="font-bold">₲ {(salesByPayment['Transferencia'] || 0).toLocaleString()}</span>
                      </div>
                      <div className="bg-gray-50 p-2 rounded text-center">
                        <span className="text-gray-500 block">Tarjeta</span>
                        <span className="font-bold">₲ {(salesByPayment['Tarjeta'] || 0).toLocaleString()}</span>
                      </div>
                    </div>

                    <h3 className="font-bold text-xs text-gray-700 mb-2">Productos Vendidos:</h3>
                    <div className="border rounded-lg overflow-hidden text-xs">
                      <table className="w-full text-left border-collapse">
                        <thead className="bg-gray-100 text-gray-600 border-b">
                          <tr>
                            <th className="p-2">Prod.</th>
                            <th className="p-2 text-center">Cant.</th>
                            <th className="p-2 text-right">Subtotal</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {Object.keys(productSalesMap).length === 0 ? (
                            <tr><td colSpan="3" className="p-3 text-center text-gray-400">Sin ventas registradas</td></tr>
                          ) : (
                            Object.entries(productSalesMap).map(([name, data]) => (
                              <tr key={name}>
                                <td className="p-2 font-medium">{name}</td>
                                <td className="p-2 text-center">{data.qty}</td>
                                <td className="p-2 text-right font-semibold">₲ {data.subtotal.toLocaleString()}</td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => window.print()}
                  className="w-full bg-gray-800 text-white py-2.5 rounded-xl font-bold text-sm shadow hover:bg-gray-900 transition"
                >
                  🖨️ Imprimir Reporte de Cierre
                </button>
              </div>
            )}

            {/* PESTAÑA GESTIÓN DE PRODUCTOS */}
            {activeTab === 'products' && (
              <div>
                <form onSubmit={handleSaveProduct} className="bg-white border rounded-xl p-3 shadow-sm mb-4 text-xs space-y-2">
                  <h3 className="font-bold text-sm text-gray-800 mb-1">{editingProduct ? 'Editar Producto' : 'Agregar Nuevo Producto'}</h3>
                  <div>
                    <label className="text-gray-600 block">Nombre del Producto:</label>
                    <input 
                      type="text" 
                      required
                      value={productForm.name}
                      onChange={(e) => setProductForm({ ...productForm, name: e.target.value })}
                      className="w-full border rounded p-1.5 mt-0.5"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-gray-600 block">Precio (₲):</label>
                      <input 
                        type="number" 
                        required
                        value={productForm.price}
                        onChange={(e) => setProductForm({ ...productForm, price: e.target.value })}
                        className="w-full border rounded p-1.5 mt-0.5"
                      />
                    </div>
                    <div>
                      <label className="text-gray-600 block">Categoría:</label>
                      <select 
                        value={productForm.category}
                        onChange={(e) => setProductForm({ ...productForm, category: e.target.value })}
                        className="w-full border rounded p-1.5 mt-0.5"
                      >
                        <option value="Comida">Comida</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Postre">Postre</option>
                        <option value="Otros">Otros</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-gray-600 block">URL de Imagen (Opcional):</label>
                    <input 
                      type="url" 
                      value={productForm.image}
                      onChange={(e) => setProductForm({ ...productForm, image: e.target.value })}
                      className="w-full border rounded p-1.5 mt-0.5"
                      placeholder="https://..."
                    />
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-1.5 rounded">
                      {editingProduct ? 'Guardar Cambios' : 'Crear Producto'}
                    </button>
                    {editingProduct && (
                      <button 
                        type="button" 
                        onClick={() => { setEditingProduct(null); setProductForm({ name: '', price: '', category: 'Comida', image: '' }); }}
                        className="bg-gray-200 text-gray-700 font-medium px-3 rounded"
                      >
                        Cancelar
                      </button>
                    )}
                  </div>
                </form>

                <h3 className="font-bold text-xs text-gray-700 mb-2">Lista de Productos Existentes:</h3>
                <div className="space-y-2">
                  {products.map(p => (
                    <div key={p.id} className="bg-white border rounded-lg p-2 flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2">
                        <img src={p.image} alt={p.name} className="w-10 h-10 rounded object-cover" />
                        <div>
                          <div className="font-bold text-gray-800">{p.name}</div>
                          <div className="text-gray-500">₲ {p.price.toLocaleString()} • {p.category}</div>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button onClick={() => startEditProduct(p)} className="bg-blue-100 text-blue-700 px-2 py-1 rounded font-semibold">Editar</button>
                        <button onClick={() => deleteProduct(p.id)} className="bg-red-100 text-red-700 px-2 py-1 rounded font-semibold">Eliminar</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MODAL VOUCHER Y QR */}
          {activeOrder && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-center shadow-xl">
                <div className="text-green-500 font-bold text-sm mb-1">¡Pedido Registrado!</div>
                <h2 className="text-xl font-bold text-gray-800">{activeOrder.id}</h2>
                <p className="text-xs text-gray-500 mb-4">{activeOrder.register} • {activeOrder.paymentMethod}</p>

                <div className="flex justify-center mb-4 bg-gray-50 p-3 rounded-xl">
                  <div id="qrcode"></div>
                </div>

                <div className="text-left bg-gray-50 p-3 rounded-xl text-xs space-y-1 mb-4">
                  <div className="font-bold text-gray-700 mb-1 border-b pb-1">Resumen del consumo:</div>
                  {activeOrder.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between">
                      <span>{it.qty}x {it.name}</span>
                      <span className="font-semibold">₲ {(it.price * it.qty).toLocaleString()}</span>
                    </div>
                  ))}
                  <div className="flex justify-between font-bold pt-1 border-t text-blue-600 text-sm">
                    <span>Total Paid:</span>
                    <span>₲ {activeOrder.total.toLocaleString()}</span>
                  </div>
                </div>

                <button 
                  onClick={() => setActiveOrder(null)}
                  className="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-sm"
                >
                  Cerrar Voucher
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
        .catch(err => console.log('Error al registrar el Service Worker:', err));
    });
  }
</script>
</body>
</html>
